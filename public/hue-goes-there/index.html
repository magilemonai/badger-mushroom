<style>
:root{
  --bg0:#140f2e; --bg1:#2a1650; --panel:#221a45; --panel2:#2f2560; --line:#ffffff1c;
  --ink:#f6f1ff; --dim:#b9aee0;
  --r:#ff4d6d; --y:#ffd23f; --b:#3da5ff; --o:#ff9a3c; --g:#3ddc84; --p:#b56bff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg0);color:var(--ink);overflow:hidden;
  font-family:"Arial Rounded MT Bold","SF Pro Rounded",ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#bg{position:fixed;inset:0;width:100%;height:100%}

/* ---------- game shell (phone first) ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-columns:100%;grid-template-rows:auto auto 1fr auto;
  grid-template-areas:"top" "side" "board" "tray";gap:6px;
  padding:calc(6px + env(safe-area-inset-top)) 8px calc(6px + env(safe-area-inset-bottom))}
#top{grid-area:top;display:flex;align-items:center;gap:6px;min-width:0}
.ib{width:38px;height:38px;flex:none;border-radius:12px;background:var(--panel2);font-weight:900;font-size:18px;
  box-shadow:0 3px 0 #120c2b, inset 0 0 0 2px var(--line)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #120c2b, inset 0 0 0 2px var(--line)}
#lvlName{flex:1;min-width:0;line-height:1.15}
#lvlName b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvlName span{font-size:12px;color:var(--dim)}
.stat{display:flex;align-items:center;gap:4px;background:var(--panel);border-radius:12px;padding:7px 9px;font-weight:900;font-size:15px;
  box-shadow:inset 0 0 0 2px var(--line);flex:none;font-variant-numeric:tabular-nums}
.stat svg{width:16px;height:16px;flex:none}
.stat.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.18)}}

#side{grid-area:side;min-width:0}
#forecast{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:14px;padding:5px 10px;height:50px;
  box-shadow:inset 0 0 0 2px var(--line)}
#forecast .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);flex:none;line-height:1.1;width:38px}
#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;align-items:center}
#chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:1px;background:#00000038;border-radius:999px;padding:2px 8px 2px 3px;font-weight:900;font-size:13px;flex:none;position:relative}
.chip canvas{width:32px;height:32px;display:block}
.chip .arr{color:var(--dim);margin:0 -2px;font-size:12px}
.chip.warn{box-shadow:0 0 0 2px var(--r);animation:warn 1s infinite}
.chip.warn::after{content:"!";position:absolute;right:-4px;top:-6px;width:16px;height:16px;border-radius:50%;background:var(--r);color:#fff;font-size:12px;line-height:16px;text-align:center}
@keyframes warn{50%{box-shadow:0 0 0 2px #ff4d6d55}}
#tipBox,#legend{display:none}

#boardWrap{grid-area:board;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
#board{display:block;border-radius:18px;box-shadow:0 10px 30px #0008, 0 0 0 3px #120c2b;touch-action:none;cursor:pointer}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);background:#120c2bee;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;
  opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 0 2px var(--line)}
#toast.on{opacity:1;transform:translate(-50%,0)}

#tray{grid-area:tray;display:grid;grid-template-columns:1fr auto;grid-template-areas:"shop go" "row2 row2";gap:6px;min-width:0}
#shop{grid-area:shop;display:flex;gap:6px;min-width:0}
.shop{flex:1;display:flex;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:16px;background:var(--panel2);
  box-shadow:0 4px 0 #120c2b, inset 0 0 0 2px var(--line);position:relative;min-width:0;transition:transform .08s}
.shop canvas{width:42px;height:42px;flex:none}
.shop .nm{display:none}
.shop .cost{font-weight:900;font-size:14px;display:flex;align-items:center;gap:2px}
.shop .cost svg{width:11px;height:11px}
.shop kbd{display:none}
.shop.armed{box-shadow:0 4px 0 #120c2b, inset 0 0 0 3px var(--c);transform:translateY(-3px);background:#3a2e78}
.shop:disabled{opacity:.42}
#btnGo{grid-area:go;min-width:104px;border-radius:16px;background:linear-gradient(#8dffc0,#2fd27c);color:#0b3520;font-weight:900;font-size:17px;
  box-shadow:0 4px 0 #128a4a;padding:0 12px}
#btnGo:active{transform:translateY(3px);box-shadow:0 1px 0 #128a4a}
#btnGo.run{background:linear-gradient(#ffe58a,#ffbd2e);color:#4a3200;box-shadow:0 4px 0 #b88a00}
#btnGo.pulse{animation:gopulse 1.2s infinite}
@keyframes gopulse{50%{filter:brightness(1.15);transform:scale(1.03)}}
#row2{grid-area:row2;display:flex;gap:8px;align-items:center;min-height:46px;min-width:0}
#balloons{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:14px;padding:4px 8px 4px 4px;box-shadow:inset 0 0 0 2px var(--line);flex:none}
#meter{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;
  background:conic-gradient(#fff calc(var(--pct,0)*1%),#ffffff22 0);position:relative}
#meter::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--panel)}
#meter span{position:relative}
.bal{width:36px;height:36px;border-radius:50% 50% 50% 50%/46% 46% 54% 54%;background:var(--c);display:grid;place-items:center;
  box-shadow:inset -4px -5px 0 #0003, inset 3px 3px 0 #fff5;transition:transform .08s}
.bal:disabled{opacity:.35;filter:saturate(.5)}
.bal.armed{transform:scale(1.18) rotate(-8deg);box-shadow:inset -4px -5px 0 #0003, inset 3px 3px 0 #fff5, 0 0 0 3px #fff}
.bal .pip{background:#150e30cc!important;width:11px;height:11px}
#selBox{flex:1;min-width:0;font-size:12.5px;color:var(--dim);line-height:1.25;display:flex;align-items:center;gap:8px}
#selBox .txt{flex:1;min-width:0}
#selBox b{color:var(--ink);font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#selBox .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btnDig{flex:none;border-radius:12px;background:#4a3a8f;padding:9px 11px;font-weight:900;font-size:13px;box-shadow:0 3px 0 #120c2b}

.pip{display:inline-block;width:.8em;height:.8em;vertical-align:-.06em;margin:0 .1em}
.pip.r{background:var(--r);clip-path:polygon(50% 2%,100% 96%,0 96%)}
.pip.y{background:var(--y);border-radius:50%}
.pip.b{background:var(--b);border-radius:2px}
.sw{display:inline-block;width:.85em;height:.85em;border-radius:50%;vertical-align:-.08em;margin-right:.25em}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;overflow-y:auto}
#title h1{margin:0;font-size:clamp(44px,13vw,104px);line-height:.95;letter-spacing:-.01em;text-shadow:0 6px 0 #0006}
#title h1 span{display:inline-block;animation:hop 2.4s infinite ease-in-out}
#title h1 .sp{width:.28em}
@keyframes hop{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-.14em) rotate(-4deg)}}
#title p{color:var(--dim);font-size:clamp(15px,4vw,19px);margin:18px 0 28px;max-width:30ch}
.big{border-radius:20px;padding:16px 34px;font-size:22px;font-weight:900;background:linear-gradient(#8dffc0,#2fd27c);color:#0b3520;box-shadow:0 6px 0 #128a4a}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #128a4a}
.ghost{border-radius:16px;padding:12px 20px;font-size:16px;font-weight:900;background:var(--panel2);box-shadow:0 4px 0 #120c2b, inset 0 0 0 2px var(--line)}
.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 #120c2b, inset 0 0 0 2px var(--line)}
.loop3{display:flex;gap:8px;justify-content:center;margin-bottom:26px;flex-wrap:wrap}
.loop3 div{background:#120c2bb0;border-radius:14px;padding:8px 12px;font-size:13px;box-shadow:inset 0 0 0 2px var(--line)}
.loop3 b{display:block;font-size:15px}
#select h2{font-size:28px;margin:0 0 4px}
#select .hint{color:var(--dim);font-size:14px;margin:0 0 18px}
#lvGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:340px}
.lv{border-radius:18px;padding:12px 8px 10px;background:var(--panel2);box-shadow:0 5px 0 #120c2b, inset 0 0 0 2px var(--line);position:relative;overflow:hidden}
.lv:active{transform:translateY(3px);box-shadow:0 2px 0 #120c2b, inset 0 0 0 2px var(--line)}
.lv .n{font-size:26px;font-weight:900;color:var(--c)}
.lv .t{font-size:13px;display:block;min-height:2.3em;line-height:1.15;margin-top:2px}
.lv .st{font-size:17px;letter-spacing:2px;color:#ffffff30}
.lv .st i{font-style:normal;color:var(--y)}
.lv:disabled{opacity:.4}
#select .ghost{margin-top:18px}

#modal{position:fixed;inset:0;background:#0b0720cc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#modalCard{background:linear-gradient(#33287060,#221a4560),var(--panel);border-radius:24px;padding:22px 20px 18px;width:100%;max-width:400px;max-height:92%;overflow-y:auto;
  box-shadow:0 20px 60px #000a, inset 0 0 0 2px var(--line);animation:pop .28s cubic-bezier(.2,1.4,.4,1);text-align:center}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#modalCard h2{margin:0 0 6px;font-size:26px}
#modalCard .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#modalCard p{font-size:15px;line-height:1.45;color:#e6defc;margin:10px 0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500}
#modalCard .btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
#modalCard .big{font-size:18px;padding:13px 24px}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0}
.stars span{display:inline-block;color:#ffffff26}
.stars span.on{color:var(--y);animation:starpop .5s cubic-bezier(.2,1.6,.4,1) backwards;text-shadow:0 0 18px #ffd23f88}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}}
.rules{text-align:left;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13.5px;line-height:1.5;color:#e6defc}
.rules h3{font-family:"Arial Rounded MT Bold","SF Pro Rounded",ui-rounded,system-ui,sans-serif;font-size:14px;margin:12px 0 2px;color:var(--ink)}
.rules ul{margin:4px 0;padding-left:18px}
.rules li{margin:2px 0}
.menuList{display:grid;gap:10px;margin-top:12px}

/* ---------- desktop ---------- */
@media (min-width:900px){
  #app{grid-template-columns:280px auto 280px;grid-template-rows:auto 1fr;grid-template-areas:"top top top" "side board tray";
    justify-content:center;gap:16px;padding:16px}
  #top{max-width:1100px;width:100%;justify-self:center}
  #lvlName b{font-size:19px}#lvlName span{font-size:13px}
  .stat{font-size:17px;padding:9px 13px}
  #side{display:flex;flex-direction:column;gap:12px;overflow-y:auto}
  #forecast{height:auto;min-height:58px;flex-wrap:wrap;padding:10px 12px}
  #forecast .lbl{width:100%}
  #chips{flex-wrap:wrap;overflow:visible}
  #tipBox,#legend{display:block;background:var(--panel);border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 2px var(--line)}
  #tipBox{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13.5px;line-height:1.45;color:#e6defc}
  #tray{grid-template-columns:1fr;grid-template-areas:"shop" "row2" "go";align-content:start;gap:12px}
  #shop{flex-direction:column;gap:8px}
  .shop{justify-content:flex-start;padding:8px 12px;min-height:66px;gap:10px;flex:none}
  .shop canvas{width:48px;height:48px}
  .shop .nm{display:block;flex:1;text-align:left;font-size:15px;line-height:1.2}
  .shop .nm small{display:block;color:var(--dim);font-size:11.5px;font-family:system-ui,sans-serif;font-weight:500}
  .shop kbd{display:block;position:absolute;right:8px;top:6px;font:700 10px system-ui;color:var(--dim)}
  #row2{flex-direction:column;align-items:stretch;gap:12px}
  #balloons{justify-content:center;padding:8px}
  #selBox{background:var(--panel);border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 2px var(--line);min-height:72px;font-size:13px}
  #selBox b{font-size:16px;white-space:normal}
  #selBox .sub{white-space:normal}
  #btnGo{min-height:64px;font-size:21px}
}
/* ?card: the title frame og.jpg is captured from. Everything sits inside the band that survives the Projects card crop. */
body.card #title{justify-content:flex-start;padding-top:44px}
body.card #title h1{font-size:136px}
body.card #title h1 span{animation:none}
body.card #title p{font-size:40px;max-width:none;margin:16px 0 0;color:#efe9ff;font-weight:700}
body.card .loop3,body.card #btnPlay{display:none}
@media (prefers-reduced-motion:reduce){ #title h1 span,.chip.warn,#btnGo.pulse{animation:none} }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="app" hidden>
  <header id="top">
    <button class="ib" id="btnMenu" aria-label="Menu">&#9776;</button>
    <div id="lvlName"><b></b><span id="waveLbl"></span></div>
    <div class="stat" id="statLives" title="Prism health"><svg viewBox="0 0 24 24"><path fill="#ff4d6d" d="M12 21s-7-4.6-9.5-9C.6 8.5 2.5 4 6.5 4c2 0 3.5 1 5.5 3 2-2 3.5-3 5.5-3 4 0 5.9 4.5 4 8-2.5 4.4-9.5 9-9.5 9z"/></svg><span>10</span></div>
    <div class="stat" id="statDew" title="Dew"><svg viewBox="0 0 24 24"><path fill="#7fd4ff" d="M12 2s7 8 7 13a7 7 0 0 1-14 0c0-5 7-13 7-13z"/></svg><span>0</span></div>
    <button class="ib" id="btnHelp" aria-label="How to play">?</button>
  </header>
  <section id="side">
    <div id="forecast"><span class="lbl" id="fcLbl">Next up</span><div id="chips"></div></div>
    <div id="tipBox"></div>
    <div id="legend" class="rules"></div>
  </section>
  <div id="boardWrap"><canvas id="board"></canvas><div id="toast"></div></div>
  <section id="tray">
    <div id="shop"></div>
    <div id="row2">
      <div id="balloons">
        <div id="meter" title="Perfect kills fill this. Full = one splat balloon."><span>0</span></div>
        <button class="bal" data-pig="1" style="--c:var(--r)" aria-label="Red splat balloon"><i class="pip r"></i></button>

        <button class="bal" data-pig="4" style="--c:var(--b)" aria-label="Blue splat balloon"><i class="pip b"></i></button>

  </section>
</div>

<div id="title" class="screen">

  <p>A color-mixing tower defense. Your sprouts are walls, and they only hurt blots that share their color.</p>
  <div class="loop3">
    <div><b style="color:var(--y)">Route</b>sprouts are walls</div>
    <div><b style="color:var(--p)">Mix</b>fuse and repaint</div>
    <div><b style="color:var(--g)">Match</b>share a pigment</div>
  </div>
  <button class="big" id="btnPlay">Play</button>
</div>

<div id="select" class="screen" hidden>
  <h2>Pick a garden</h2>
  <p class="hint">Three stars for a spotless Prism.</p>
  <div id="lvGrid"></div>
  <button class="ghost" id="btnSelHelp">How to play</button>
</div>

<div id="modal" hidden><div id="modalCard"></div></div>

<script>
(() => {
'use strict';
/* =====================================================================
   HUE GOES THERE?  -  route / mix / match tower defense
   ===================================================================== */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const COLS = 7, ROWS = 9, N = COLS * ROWS;
const R = 1, Y = 2, B = 4;
const STEP = 1 / 60;
const CFG = { cost: 30, lives: 10, waveGrow: 0.2, chargeNeed: 5, maxBalloons: 3, splatR: 1.35, refund: 0.6 };
const HEX  = {1:'#ff4d6d',2:'#ffd23f',4:'#3da5ff',3:'#ff9a3c',6:'#3ddc84',5:'#b56bff',7:'#ffffff'};
const DARK = {1:'#a3163a',2:'#a87c00',4:'#1259b0',3:'#b05400',6:'#0f7d42',5:'#6427b0',7:'#8a84b0'};
const LITE = {1:'#ffb3c1',2:'#fff3b0',4:'#c4e4ff',3:'#ffd6a5',6:'#c1f7d6',5:'#e6ccff',7:'#ffffff'};

const DIRS = [[0,1],[1,0],[-1,0],[0,-1]];
const bitsOf = m => [1,2,4].filter(b => m & b);
const pipHTML = m => bitsOf(m).map(b => `<i class="pip ${b===1?'r':b===2?'y':'b'}"></i>`).join('');

const SPROUT = {
  1:{name:'Pepper Pop', blurb:'Rapid-fire seeds', dmg:9,  cd:.45, range:1.9, kind:'seed'},
  2:{name:'Sunbeam',    blurb:'Long-range zap',   dmg:28, cd:1.5, range:3.0, kind:'zap'},
  4:{name:'Dewdrop',    blurb:'Chills blots to a crawl', dmg:8, cd:.6, range:2.0, kind:'drop', slow:.4},
  3:{name:'Marmalade Mortar', blurb:'Sticky splash damage', dmg:24, cd:1.0, range:2.6, kind:'lob', splash:.9},
  6:{name:'Thornvine',  blurb:'Poison that keeps ticking', dmg:8, cd:.8, range:2.5, kind:'thorn', poison:14},
  5:{name:'Plum Bolt',  blurb:'Lightning that chains', dmg:20, cd:.9, range:2.5, kind:'chain'},
  7:{name:'Prism Bloom',blurb:'Rainbow beam, hurts everything', dmg:62, cd:0, range:2.8, kind:'beam'},
};
const LVMULT = [0, 1, 2.6, 7];
const BLOT = {
  dribble: {hp:40,  spd:1.15, dew:4,  leak:1, r:.25, label:'Dribbles'},
  zipper:  {hp:22,  spd:2.1,  dew:3,  leak:1, r:.19, label:'Zippers'},
  chonk:   {hp:160, spd:.7,   dew:10, leak:2, r:.35, label:'Chonks'},
  bubble:  {hp:34,  spd:1.2,  dew:5,  leak:1, r:.22, label:'Bubbles', fly:true},
  splitter:{hp:90,  spd:.95,  dew:6,  leak:2, r:.31, label:'Splitters'},
  boss:    {hp:1100,spd:.5,   dew:60, leak:5, r:.46, label:'Big Blot'},
};

/* waves: [type, pigments, count, gap seconds, delay, burrow] */
const O = R|Y, G = Y|B, P = R|B, OPAL = 7;
const LEVELS = [

function drawRoute(c, cells, alpha, t) {

}

/* ---------------- background ---------------- */
const bgc = $('#bg'), bx = bgc.getContext('2d'); let bw = 0, bh = 0, bdpr = 1;
const orbSprites = {};
for (const m of [1, 2, 4, 3, 6, 5]) { const s = document.createElement('canvas'); s.width = s.height = 128; const c = s.getContext('2d'), gr = c.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, HEX[m] + '66'); gr.addColorStop(1, HEX[m] + '00'); c.fillStyle = gr; c.fillRect(0, 0, 128, 128); orbSprites[m] = s; }
const orbs = [...Array(9)].map((_, i) => ({ x: Math.random(), y: Math.random(), r: rnd(.5, .25), vx: rnd(.02, -.02), vy: rnd(.02, -.02), m: [1, 2, 4, 3, 6, 5][i % 6] }));
const CARD = /[?&]card\b/.test(location.search);   // ?card: static title frame for og.jpg
const parade = CARD
  ? [...Array(7)].map((_, i) => ({ x: .11 + i * .13, mask: [1, 3, 2, 6, 4, 5, 7][i], type: ['dribble', 'chonk', 'zipper', 'dribble', 'splitter', 'bubble', 'chonk'][i], seed: i * 7.3 }))
  : [...Array(9)].map((_, i) => ({ x: i / 9 + rnd(.04), mask: [1, 3, 2, 6, 4, 5, 7, 1, 4][i], type: ['dribble', 'chonk', 'zipper', 'dribble', 'splitter', 'dribble', 'chonk', 'bubble', 'zipper'][i], seed: rnd(50) }));
function drawBg(t, dt) {
  const c = bx; c.setTransform(bdpr, 0, 0, bdpr, 0, 0);
  const gr = c.createLinearGradient(0, 0, 0, bh); gr.addColorStop(0, '#140f2e'); gr.addColorStop(1, '#2a1650'); c.fillStyle = gr; c.fillRect(0, 0, bw, bh);
  const m = Math.max(bw, bh);
  for (const o of orbs) { o.x += o.vx * dt; o.y += o.vy * dt; if (o.x < -.2 || o.x > 1.2) o.vx *= -1; if (o.y < -.2 || o.y > 1.2) o.vy *= -1; const r = o.r * m; c.drawImage(orbSprites[o.m], o.x * bw - r, o.y * bh - r, r * 2, r * 2); }
  if (screen !== 'game') {
    const R0 = CARD ? 54 : Math.min(34, Math.max(18, bw * .035)), baseY = bh - (CARD ? 132 : R0 * 1.6);
    for (const p of parade) { if (!CARD) { p.x += dt * .035 * (p.type === 'zipper' ? 1.8 : p.type === 'chonk' ? .6 : 1); if (p.x > 1.1) p.x = -.1; } const T = BLOT[p.type]; drawBlot(c, p.x * bw, baseY, R0 * T.r * 3.4, p.mask, p.type, CARD ? 0 : t, p.seed, { dx: CARD ? 0 : 1, dy: 0 }); }
  }
}

function toast(msg) { if (headless) return; const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2100); }
function bump(sel2) { if (headless) return; const el = $(sel2); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function miniCanvas(px, draw) { const cvs = document.createElement('canvas'); cvs.width = cvs.height = px * 2; const c = cvs.getContext('2d'); c.scale(2, 2); draw(c, px); return cvs; }

function buildShop() {
  const el = $('#shop'); el.innerHTML = '';
  g.L.shop.forEach((m, k) => {
    const b = document.createElement('button'); b.className = 'shop'; b.dataset.mask = m; b.style.setProperty('--c', HEX[m]);
    b.setAttribute('aria-label', `Plant ${SPROUT[m].name}, ${CFG.cost} dew`);
    b.appendChild(miniCanvas(48, (c, s) => drawSprout(c, s / 2, s / 2 - 2, s * .95, m, 1, 0, {})));
    b.insertAdjacentHTML('beforeend', `<span class="nm">${SPROUT[m].name}<small>${SPROUT[m].blurb}</small></span><span class="cost"><svg viewBox="0 0 24 24"><path fill="#7fd4ff" d="M12 2s7 8 7 13a7 7 0 0 1-14 0c0-5 7-13 7-13z"/></svg>${CFG.cost}</span><kbd>${k + 1}</kbd>`);
    b.onclick = () => { Snd.unlock(); if (g.phase !== 'plant') return; armed = armed === m ? 0 : m; sel = null; armedBalloon = 0; Snd.tick(); uiDirty = true; };
    el.appendChild(b);
  });
}
function buildForecast() {
  if (!g) return;
  const el = $('#chips'); el.innerHTML = '';
  $('#fcLbl').textContent = g.phase === 'wave' ? 'Now' : g.phase === 'plant' ? 'Next up' : '';
  const wave = g.L.waves[Math.min(g.wave, g.L.waves.length - 1)]; if (!wave || g.phase === 'won') return;
  const masks = g.sprouts.filter(Boolean).map(s => s.mask);
  for (const [type, mask, count, , , sp = 0] of wave) {
    const T = BLOT[type], route = g.routes[Math.min(sp, g.routes.length - 1)] || [];
    let fin = mask; if (!T.fly) for (const cidx of route) fin |= g.puddle[cidx];
    const chip = document.createElement('div'); chip.className = 'chip';
    const icon = m => miniCanvas(32, (c, s) => drawBlot(c, s / 2, s / 2 + 5, Math.min(11, s * T.r * 1.1), m, type, 0, 3, { dx: 0, dy: 1 }));
    chip.appendChild(icon(mask));
    if (fin !== mask) { chip.insertAdjacentHTML('beforeend', '<span class="arr">&rarr;</span>'); chip.appendChild(icon(fin)); }
    chip.insertAdjacentHTML('beforeend', `<span>&times;${count}</span>`);
    const can = masks.some(m => m & fin);
    chip.title = `${count} ${CNAME[mask]} ${T.label}` + (fin !== mask ? ` (turn ${CNAME[fin]} in a puddle)` : '') + (can ? '' : '. Nothing you have planted can hurt these.');
    if (!can && g.phase === 'plant' && masks.length) chip.classList.add('warn');
    el.appendChild(chip);
  }
}
function legendHTML() {
  const sw = m => `<span class="sw" style="background:${HEX[m]}"></span>`;
  return `<h3>Match</h3>A sprout hurts any blot that shares a pigment shape with it. Identical shapes is a PERFECT hit: double damage, bonus dew, and it charges your splat balloons.
  <h3>Mix</h3><ul>
   <li>${sw(3)}${pipHTML(1)}+${pipHTML(2)} Mortar: splash</li>
   <li>${sw(6)}${pipHTML(2)}+${pipHTML(4)} Thornvine: poison</li>
   <li>${sw(5)}${pipHTML(1)}+${pipHTML(4)} Plum Bolt: chains</li>
   <li>Twins fuse to level up (max 3)</li>
   <li>Mixed + its opposite primary = Prism Bloom</li>
   <li>Puddles and balloons add a pigment to blots</li></ul>
  <h3>Route</h3>Blots take the shortest open path. Sprouts are walls. Fusing frees a tile.`;
}
function ui() {
  uiDirty = false; if (!g) return;
  $('#statLives span').textContent = g.lives; $('#statDew span').textContent = g.dew;
  const W = g.L.waves.length; $('#waveLbl').textContent = `Wave ${Math.min(g.wave + 1, W)} of ${W}`;
  document.querySelectorAll('.shop').forEach(b => { const m = +b.dataset.mask; b.disabled = g.phase !== 'plant' || g.dew < CFG.cost; b.classList.toggle('armed', armed === m); });
  document.querySelectorAll('.bal').forEach(b => { b.disabled = g.balloons <= 0 || g.phase !== 'wave'; b.classList.toggle('armed', armedBalloon === +b.dataset.pig); });
  const mt = $('#meter'); mt.style.setProperty('--pct', g.balloons >= CFG.maxBalloons ? 100 : g.charge / CFG.chargeNeed * 100); mt.firstElementChild.textContent = g.balloons;
  const go = $('#btnGo'); go.classList.toggle('run', g.phase === 'wave');
  go.textContent = g.phase === 'wave' ? `Speed ${g.speed}×` : 'Send wave';
  go.classList.toggle('pulse', g.phase === 'plant' && g.sprouts.some(Boolean) && g.dew < CFG.cost);
  go.disabled = g.phase === 'won' || g.phase === 'lost';
  const sb = $('#selBox');
  if (sel) {
    const S = SPROUT[sel.mask];
    sb.innerHTML = `<div class="txt"><b>${S.name} · L${sel.lvl}</b><span class="sub">Hurts ${pipHTML(sel.mask)} · ${S.blurb}</span></div>` + (g.phase === 'plant' ? `<button id="btnDig">Dig +${refundOf(sel)}</button>` : '');
    const d = $('#btnDig'); if (d) d.onclick = () => dig(sel);
  } else if (armedBalloon) sb.innerHTML = `<div class="txt"><b>Splat balloon</b><span class="sub">Adds ${pipHTML(armedBalloon)} to blots · tap to throw</span></div>`;
  else if (armed) sb.innerHTML = `<div class="txt"><b>${SPROUT[armed].name}</b><span class="sub">Hurts ${pipHTML(armed)} · tap a tile to plant</span></div>`;
  else sb.innerHTML = `<div class="txt"><span class="sub">${g.phase === 'plant' ? 'Pick a sprout, tap a tile.' : 'Perfect kills earn balloons.'}</span><span class="sub">${g.phase === 'plant' ? 'Tap two neighbors to fuse.' : ''}</span></div>`;
}

/* ---------------- modals + screens ---------------- */
function modal(html) { $('#modalCard').innerHTML = html; $('#modal').hidden = false; paused = true; }
function closeModal() { $('#modal').hidden = true; paused = false; }
function showIntro() {
  const L = g.L;
  modal(`<div class="eyebrow">Garden ${g.n + 1} of ${LEVELS.length}</div><h2>${L.name}</h2><p>${L.tip}</p><div class="btns"><button class="big" data-act="close">Let's grow</button></div>`);
}
function showWin() {
  if (!g || g.phase !== 'won') return;
  const st = g.stars, last = g.n >= LEVELS.length - 1;
  const line = st === 3 ? 'Spotless. Not one blot got through.' : st === 2 ? 'Prism safe, a little splattered.' : 'Survived by a petal.';
  modal(`<div class="eyebrow">${g.L.name}</div><h2>${last ? 'Garden defended!' : 'Garden cleared!'}</h2>
    <div class="stars">${[0, 1, 2].map(k => `<span class="${k < st ? 'on' : ''}" style="animation-delay:${.15 + k * .22}s">★</span>`).join('')}</div>
    <p>${line}${last && st ? '<br>That was the last garden. The blots are sulking.' : ''}</p>
    <div class="btns"><button class="ghost" data-act="retry">Replay</button>${last ? '<button class="big" data-act="select">Gardens</button>' : '<button class="big" data-act="next">Next garden</button>'}</div>`);
}
function showLose() {
  if (!g || g.phase !== 'lost') return;
  modal(`<div class="eyebrow">${g.L.name} · wave ${g.wave + 1}</div><h2>The Prism cracked</h2><p>Check the forecast before each wave: a chip with a red ring means nothing you have planted shares a pigment with those blots.</p>
    <div class="btns"><button class="ghost" data-act="select">Gardens</button><button class="big" data-act="retry">Try again</button></div>`);
}
function showHelp() { modal(`<h2>How it works</h2><div class="rules">${legendHTML()}</div><div class="btns"><button class="big" data-act="close">Got it</button></div>`); }
function showMenu() {
  modal(`<h2>Paused</h2><div class="menuList">
    <button class="big" data-act="close">Resume</button>
    <button class="ghost" data-act="tip">Garden tip</button>
    <button class="ghost" data-act="retry">Restart garden</button>
    <button class="ghost" data-act="mute">Sound: ${Snd.muted ? 'off' : 'on'}</button>
    <button class="ghost" data-act="select">All gardens</button></div>`);
}
$('#modal').addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return; Snd.unlock(); Snd.tick();
  const act = b.dataset.act;
  if (act === 'close') closeModal();
  else if (act === 'retry') { closeModal(); startLevel(g.n); }
  else if (act === 'next') { closeModal(); startLevel(g.n + 1); }
  else if (act === 'select') { closeModal(); showSelect(); }
  else if (act === 'tip') showIntro();
  else if (act === 'mute') { Snd.toggle(); showMenu(); }
});
function show(name) { screen = name; $('#title').hidden = name !== 'title'; $('#select').hidden = name !== 'select'; $('#app').hidden = name !== 'game'; }
function showSelect() {
  show('select'); const el = $('#lvGrid'); el.innerHTML = '';
  LEVELS.forEach((L, n) => {
    const b = document.createElement('button'); b.className = 'lv'; const st = save.stars[n] || 0;
    b.style.setProperty('--c', HEX[[1, 3, 2, 6, 4, 5, 1, 2][n]]);
    b.disabled = n > 0 && !(save.stars[n - 1] > 0);
    b.innerHTML = `<span class="n">${n + 1}</span><span class="t">${L.name}</span><span class="st">${[0, 1, 2].map(k => k < st ? '<i>★</i>' : '★').join('')}</span>`;
    b.onclick = () => { Snd.unlock(); Snd.tick(); startLevel(n); };
    el.appendChild(b);
  });
}
function startLevel(n) {
  loadLevel(n); show('game');
  $('#lvlName b').textContent = `${n + 1} · ${g.L.name}`; $('#tipBox').innerHTML = g.L.tip; $('#legend').innerHTML = legendHTML();
  buildShop(); ui(); resize(); buildForecast(); showIntro();
}

/* ---------------- input ---------------- */
function boardPos(ev) { const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) / C, y = (ev.clientY - r.top) / C, cx = Math.floor(x), cy = Math.floor(y), inB = cx >= 0 && cy >= 0 && cx < COLS && cy < ROWS; return { x, y, cx, cy, in: inB, i: inB ? idx(cx, cy) : -1 }; }
function tap(p) {
  if (!p.in || !g || paused) return;
  const s = g.sprouts[p.i];
  if (armedBalloon) { if (g.phase === 'wave') throwBalloon(p.x, p.y, armedBalloon); return; }
  if (s) {
    if (g.phase === 'plant' && sel && sel !== s && canFuse(sel, s)) { fuse(sel, s); return; }
    sel = sel === s ? null : s; armed = 0; Snd.tick(); uiDirty = true; return;
  }
  if (g.phase === 'plant' && armed) { tryPlant(p.i, armed); return; }
  if (sel) { sel = null; uiDirty = true; }
  else if (g.phase === 'plant' && buildable(p.i)) toast('Pick a sprout from the tray first');
}
function updateHover(p) {
  if (!g || g.phase !== 'plant' || !armed || !p.in) { hover.i = -1; return; }
  if (hover.i === p.i) return;
  hover.i = p.i; hover.ok = false; hover.routes = null;
  if (!buildable(p.i)) return;
  const d = sealCheck(p.i); if (!d) return;
  hover.ok = true; hover.routes = g.spawns.map(s => routeFrom(s, d));
}
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault(); Snd.unlock(); if (!g || paused) return;
  const p = boardPos(ev); pointer = p; if (!p.in) return;
  const s = g.sprouts[p.i];
  if (g.phase === 'plant' && s && !armedBalloon) { drag = { from: s, x: p.x, y: p.y, moved: false }; try { cv.setPointerCapture(ev.pointerId); } catch (e) {} return; }
  tap(p);
});
cv.addEventListener('pointermove', ev => {
  const p = boardPos(ev); pointer = p;
  if (drag) { drag.x = p.x; drag.y = p.y; if (p.i !== drag.from.i) drag.moved = true; }
  if (ev.pointerType === 'mouse') updateHover(p);
});
cv.addEventListener('pointerup', ev => {
  if (!drag) return; const p = boardPos(ev), d = drag; drag = null;
  if (p.in && p.i !== d.from.i) {
    const tgt = g.sprouts[p.i];
    if (tgt && canFuse(d.from, tgt)) fuse(d.from, tgt);
    else if (tgt) { toast(Math.abs(tgt.x - d.from.x) + Math.abs(tgt.y - d.from.y) !== 1 ? 'Only neighbors can fuse' : tgt.lvl !== d.from.lvl ? 'Fuse sprouts of the same level' : "Those two share a pigment, so they won't blend"); Snd.bad(); }
  } else tap(p);
});
cv.addEventListener('pointercancel', () => { drag = null; });
cv.addEventListener('pointerleave', () => { hover.i = -1; pointer = null; });
document.querySelectorAll('.bal').forEach(b => b.onclick = () => {
  Snd.unlock(); if (!g || g.phase !== 'wave' || g.balloons <= 0) return;
  const pig = +b.dataset.pig; armedBalloon = armedBalloon === pig ? 0 : pig; sel = null; Snd.tick(); uiDirty = true;
});
function goPress() {
  if (!g || paused) return; Snd.unlock();
  if (g.phase === 'plant') { if (!g.sprouts.some(Boolean)) { toast('Plant at least one sprout first'); Snd.bad(); return; } sel = null; startWave(); }
  else if (g.phase === 'wave') { g.speed = g.speed % 3 + 1; Snd.tick(); uiDirty = true; }
}
$('#btnGo').onclick = goPress;
$('#btnMenu').onclick = () => { Snd.unlock(); showMenu(); };
$('#btnHelp').onclick = () => { Snd.unlock(); showHelp(); };
$('#btnPlay').onclick = () => { Snd.unlock(); Snd.tick(); showSelect(); };
$('#btnSelHelp').onclick = () => { Snd.unlock(); showHelp(); };
window.addEventListener('keydown', ev => {
  if (screen !== 'game' || !g) return;
  if (ev.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else { armed = 0; sel = null; armedBalloon = 0; uiDirty = true; } return; }
  if (paused) return;
  const k = ev.key.toLowerCase();
  if (k >= '1' && k <= '3') { const b = document.querySelectorAll('.shop')[+k - 1]; if (b) b.click(); }
  else if (k === ' ') { ev.preventDefault(); goPress(); }
  else if (k === 'q' || k === 'w' || k === 'e') document.querySelectorAll('.bal')[{ q: 0, w: 1, e: 2 }[k]].click();
  else if ((k === 'x' || k === 'delete' || k === 'backspace') && sel) dig(sel);
});

/* ---------------- sizing + loop ---------------- */
function resize() {
  bdpr = Math.min(window.devicePixelRatio || 1, 1.5); bw = innerWidth; bh = innerHeight; bgc.width = bw * bdpr; bgc.height = bh * bdpr;
  if (screen !== 'game' || !g) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const desk = innerWidth >= 900, topH = $('#top').offsetHeight; let aw, ah;
  if (desk) { aw = innerWidth - 2 * 280 - 2 * 16 - 32; ah = innerHeight - topH - 16 * 3; }
  else { aw = innerWidth - 16; ah = innerHeight - topH - $('#side').offsetHeight - $('#tray').offsetHeight - 6 * 3 - 14; }
  C = Math.floor(Math.max(26, Math.min(aw / COLS, ah / ROWS, 86)));
  BW = C * COLS; BH = C * ROWS; cv.style.width = BW + 'px'; cv.style.height = BH + 'px'; cv.width = BW * dpr; cv.height = BH * dpr;
  buildStatic();
}
window.addEventListener('resize', resize);
let lastT = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastT) / 1000, .1); lastT = now;
  drawBg(now / 1000, dt);
  if (screen === 'game' && g) {
    if (!paused) {
      acc += dt * (g.phase === 'wave' ? g.speed : 1); let n = 0;
      while (acc >= STEP && n < 14) { update(STEP); acc -= STEP; n++; } if (n === 14) acc = 0;
    }
    g.vt += dt; render(); if (uiDirty) ui();
  }
}

/* ---------------- boot ---------------- */
{ const cols = ['r', 'o', 'y', 'g', 'b', 'p']; let k = 0;
  $('#wordmark').innerHTML = 'HUE GOES|THERE?'.split('').map(ch => ch === '|' ? '<br>' : ch === ' ' ? '<span class="sp"></span>' : `<span style="color:var(--${cols[k % 6]});animation-delay:${(k++) * .09}s">${ch}</span>`).join(''); }
if (CARD) { document.body.classList.add('card'); $('#title p').textContent = 'A color-mixing tower defense'; }
LEVELS.forEach((L, n) => { console.assert(L.map.length === ROWS && L.map.every(r => r.length === COLS), 'bad map ' + n); });
resize(); requestAnimationFrame(frame);

/* debug / balance hooks */
window.HUE = {
  get g() { return g; }, LEVELS, start: startLevel, plant: (x, y, m) => { armed = m; return tryPlant(idx(x, y), m); },
  fuse: (x1, y1, x2, y2) => fuse(g.sprouts[idx(x1, y1)], g.sprouts[idx(x2, y2)]), close: closeModal,
  _: { buildable, canFuse, fuseResult, recompute, dig, rangeOf, SPROUT, BLOT, CFG, LVMULT, quiet(v) { headless = v; Snd.off = v; if (!v && g) { buildForecast(); uiDirty = true; } } },
  sim() { headless = true; Snd.off = true; startWave(); let n = 0; while (g.phase === 'wave' && n++ < 60 * 900) update(STEP); headless = false; Snd.off = false; buildForecast(); uiDirty = true; return { phase: g.phase, wave: g.wave, lives: g.lives, dew: g.dew, balloons: g.balloons }; },
};
})();
</script>
