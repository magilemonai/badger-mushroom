const NOTE = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
function pmidi(s) {
  const m = /^([a-g])([#b]?)(\d)$/.exec(s);
  if (!m) throw new Error('bad note ' + s);
  return 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
function pchord(s) {
  const m = /^([A-G])([#b]?)/.exec(s);
  const pc = (NOTE[m[1].toLowerCase()] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12;
  return { root: 40 + ((pc - 4 + 12) % 12) };
}
const DR = {
  rock:    ['x.......x.x.....', '....x.......x...', 'x.x.x.x.x.x.x.x.'],
  big:     ['x.....x.x.x.....', '....x.......x...', 'o.x.o.x.o.x.o.x.'],
  shuffle: ['x.......x.......', '....x.......x...', 'x.x.x.x.x.x.x.x.'],
  metal:   ['x.xxx.xxx.xxx.xx', '....x.......x...', 'x...x...x...x...'],
  drive:   ['x...x...x...x...', '....x.......x...', 'x.x.x.x.x.x.x.x.'],
  end:     ['x...............', '................', '................'],
};

function assignLanes(list) {
  const ps = [...new Set(list.flatMap(n => n.midis))].sort((a, b) => a - b);
  const q = m => Math.min(3, Math.floor(ps.indexOf(m) * 4 / ps.length));
  let pl = -1, pm = -1;
  for (const n of list) {
    const m = n.midis[0];
    let l = q(m);
    if (pl >= 0) {
      if (m === pm) l = pl;
      else if (m > pm && l <= pl) l = pl >= 3 ? 2 : pl + 1;
      else if (m < pm && l >= pl) l = pl <= 0 ? 1 : pl - 1;
    }
    n.lanes = [l];
    if (n.midis.length > 1) {
      let l2 = Math.max(q(n.midis[1]), l + 1);
      if (l2 > 3) { l2 = 3; if (l >= 3) n.lanes[0] = l = 2; }
      n.lanes.push(l2);
    }
    pl = n.lanes[0]; pm = m;
  }
}

const compiled = {};
function getSong(i) {
  if (compiled[i]) return compiled[i];
  const def = SONGS[i], beat = 60 / def.bpm, sw = def.swing || .5;
  const tt = ticks => { const b = Math.floor(ticks / 4), p = ticks - b * 4; return (b + (p < 2 ? p / 2 * sw : sw + (p - 2) / 2 * (1 - sw))) * beat; };
  const ev = [], notes = [], lyrics = [];
  for (let b = 0; b < 4; b++) ev.push({ t: tt(b * 4), k: 'X' });
  let bar = 1;
  for (const s of def.sections) {
    const chords = s.ch.split(' ').map(pchord);
    const dp = DR[s.dr];
    for (let b = 0; b < s.bars; b++) {
      const bt = (bar + b) * 16, c = chords[b % chords.length];
      const lastBar = b === s.bars - 1 && s.dr !== 'end' && s.bars > 1;
      // drums
      for (let k = 0; k < 16; k++) {
        const t = tt(bt + k);
        if (lastBar && k >= 12) {
          if (k % 2 === 0 || !def.swing) ev.push({ t, k: k < 14 ? 'S' : 'T', v: .7 + (k - 12) * .08, f: k === 14 ? 170 : 125 });
          continue;
        }
        if (dp[0][k] === 'x') ev.push({ t, k: 'K', v: k % 4 === 0 ? 1 : .8 });
        if (dp[1][k] === 'x') ev.push({ t, k: 'S', v: 1 });
        if (dp[2][k] === 'x') ev.push({ t, k: 'H', v: k % 4 === 0 ? 1 : .6 });
        if (dp[2][k] === 'o') ev.push({ t, k: 'H', v: 1, o: true });
      }
      if (b === 0 && (s.dr === 'big' || s.dr === 'end' || s.dr === 'metal')) ev.push({ t: tt(bt), k: 'C' });
      // guitar + bass
      const G_ = (tick, len, v, pm, ints) => ev.push({ t: tt(bt + tick), k: 'g', m: (ints || [0, 7, 12]).map(x => c.root + x), d: tt(bt + tick + len) - tt(bt + tick), v, pm });
      const B_ = (tick, len, off, v) => ev.push({ t: tt(bt + tick), k: 'b', m: c.root + (off || 0), d: tt(bt + tick + len) - tt(bt + tick), v: v || 1 });
      switch (s.gt) {
        case 'chug8': for (let k = 0; k < 16; k += 2) G_(k, 1.7, k % 8 === 0 ? 1 : .8, true); break;
        case 'open8': for (let k = 0; k < 16; k += 2) G_(k, 2, k % 8 === 0 ? 1 : .72, false); break;
        case 'shuffle': for (let q = 0; q < 4; q++) { const ints = q % 2 ? [0, 9] : [0, 7]; G_(q * 4, 1.8, .9, false, ints); G_(q * 4 + 2, 1.5, .65, false, ints); } break;
        case 'gallop': for (let q = 0; q < 4; q++) { G_(q * 4, 1.8, 1, true); G_(q * 4 + 2, .9, .7, true); G_(q * 4 + 3, .9, .7, true); } break;
        case 'hold': G_(0, 14, 1, false); break;
      }
      switch (s.bs) {
        case 'root8': for (let k = 0; k < 16; k += 2) B_(k, 1.8, 0, k % 8 === 0 ? 1 : .8); break;
        case 'boogie': [0, 4, 7, 9, 10, 9, 7, 4].forEach((o, k) => B_(k * 2, 1.8, o, k % 2 ? .8 : 1)); break;
        case 'gallop': for (let q = 0; q < 4; q++) { B_(q * 4, 1.8); B_(q * 4 + 2, .9, 0, .7); B_(q * 4 + 3, .9, 0, .7); } break;
        case 'hold': B_(0, 14); break;
      }
    }
    // melody
    let pos = bar * 16;
    const secNotes = [];
    for (const tok of s.mel.split(/\s+/)) {
      if (!tok || tok === '|') continue;
      const m = /^(.+)\.(\d+)(~?)$/.exec(tok);

    const cw = Math.min(300, (W - 60 - gap * (n - 1)) / n), ch = Math.min(400, H - top - bot - 10);
    const x0 = (W - (cw * n + gap * (n - 1))) / 2, y0 = top + (H - top - bot - ch) / 2;
    for (let i = 0; i < n; i++) drawCard(i, x0 + i * (cw + gap), y0, cw, ch, sel === i);
  }
  finish();
  const hint = RF.auto ? 'ROADIE MODE ON: the birds play themselves (B to turn off)' : isTouch ? 'pick a song' : 'ARROWS  choose   ·   ENTER  play   ·   B  roadie mode (autoplay)';
  txt(hint, W / 2, H - bot * .5, Math.min(Math.max(11, 13 * u), fitSize(hint, W * .92, { f: FB, wt: 700 })), { f: FB, wt: 700, sw: 3, c: RF.auto ? '#8ff6ff' : CREAM });
}
function renderResults() {
  drawBackdrop(R.failed ? .15 : .9);
  g.fillStyle = 'rgba(12,4,24,.45)'; g.fillRect(0, 0, W, H);
  const u = L.u, pw = Math.min(W - 24, 470), ph = Math.min(H - 24, 480), px = (W - pw) / 2, py = (H - ph) / 2, k = clamp(ph / 480, .6, 1), t = R.t;
  const slide = (1 - E.out(clamp(t / .45, 0, 1))) * 60;
  g.save(); g.translate(0, slide); g.globalAlpha = clamp(t / .3, 0, 1);
  g.save(); g.translate(W / 2, py + ph / 2); g.rotate(-.012); g.translate(-W / 2, -(py + ph / 2));
  rr(px + 6, py + 9, pw, ph, 16); g.fillStyle = 'rgba(12,4,24,.55)'; g.fill();
  rr(px, py, pw, ph, 16); g.fillStyle = CREAM; g.fill(); g.lineWidth = 4; g.strokeStyle = INK; g.stroke();
  let y = py + 40 * k;
  const head = R.failed ? 'THE CAT GOT THE GIG' : ['', 'YOU SURVIVED', 'NOT BAD', 'SOLID SET', 'HEADLINER!', 'ROCK LEGEND!'][R.f];
  txt(head, W / 2, y, Math.min(46 * k, fitSize(head, pw - 40)), { c: R.failed ? '#ff9a3c' : '#ffc62e', ex: 4, exc: '#e0284f' });
  y += 40 * k;
  txt(R.title, W / 2, y, 17 * k, { c: '#5b3f78', sw: 0, f: FB, it: true, wt: 700 });
  y += 46 * k;
  // feathers
  const fs = 20 * k;
  for (let i = 0; i < 5; i++) {
    const at = .7 + i * .22, on = i < R.f && t > at, q = on ? clamp((t - at) / .3, 0, 1) : 0;
    if (on && R.pops === i) { R.pops++; chirp(2000 + i * 260, .1); feathers(W / 2 + (i - 2) * fs * 2.3, y + slide, '#ffc62e', 5); }
    g.save(); g.translate(W / 2 + (i - 2) * fs * 2.3, y); const s = on ? E.back(q) : 1; g.scale(s, s);
    drawFeather(0, 0, fs, '#ffc62e', .3, on); g.restore();
  }
  y += 62 * k;
  const shown = Math.round(R.score * E.out(clamp((t - .3) / 1.1, 0, 1)));
  txt(shown.toLocaleString(), W / 2, y, 60 * k, { c: INK, sw: 0 });
  if (R.isBest && t > 1.5) { g.save(); g.translate(px + pw - 70 * k, y - 36 * k); g.rotate(.2); const s = E.back(clamp((t - 1.5) / .3, 0, 1)); g.scale(s, s); txt('NEW BEST!', 0, 0, 22 * k, { c: '#f2414f', st: CREAM, sw: 5 }); g.restore(); }
  y += 54 * k;
  const rows = [['PERFECT', R.cnt[0], '#e08c0c'], ['GREAT', R.cnt[1], '#176fc4'], ['OK', R.cnt[2], '#6a37c2'], ['MISSED', R.cnt[3], '#b51d3b']];
  const colW = (pw - 40) / 4;
  rows.forEach((rw, i) => {
    const cx = px + 20 + colW * (i + .5);
    txt(String(rw[1]), cx, y, 28 * k, { c: rw[2], sw: 0 });
    txt(rw[0], cx, y + 22 * k, 10.5 * k, { c: INK, sw: 0, f: FB, wt: 800 });
  });
  y += 58 * k;
  txt('ACCURACY  ' + Math.round(R.acc * 100) + '%     ·     BEST STREAK  ' + R.maxStreak, W / 2, y, Math.min(13 * k, fitSize('ACCURACY  100%     ·     BEST STREAK  000', pw - 44, { f: FB, wt: 800 })), { c: INK, sw: 0, f: FB, wt: 800 });
  if (R.auto) txt('(roadie mode: score not saved)', W / 2, y + 20 * k, 11 * k, { c: '#8a7a9c', sw: 0, f: FB, it: true, wt: 700 });
  g.restore();
  const bh = Math.max(44, 50 * k), bw = Math.min(190, (pw - 54) / 2), by = py + ph - bh * .5 - 22 * k;
  button(R.failed ? 'TRY AGAIN' : 'ENCORE', W / 2 - bw / 2 - 8, by, bw, bh, restartSong);
  button('SET LIST', W / 2 + bw / 2 + 8, by, bw, bh, () => go(() => { state = 'select'; setTheme('dusk'); }), { c: '#fff' });
  g.restore();
  drawParts();
  finish();
}

const byEl = document.getElementById('by');
function render() {
  if (byEl.hidden !== (state !== 'title' || !!RF.card)) byEl.hidden = state !== 'title' || !!RF.card;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  btns = [];
  if (state === 'title') renderTitle();
  else if (state === 'select') renderSelect();
  else if (state === 'play' && G) renderPlay();
  else if (state === 'results' && R) renderResults();
  if (fade.a > 0) { g.fillStyle = 'rgba(20,12,34,' + E.io(fade.a) + ')'; g.fillRect(0, 0, W, H); }
}

// ============================================================ input
const KEYS = { KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3, Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, ArrowLeft: 0, ArrowDown: 1, ArrowUp: 2, ArrowRight: 3 };
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const c = e.code;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Enter'].includes(c)) e.preventDefault();
  if (e.repeat) return;
  isTouch = false;
  audioInit();
  if (fade.d > 0) return;
  if (state === 'title') { if (c === 'Enter' || c === 'Space') { chirp(2600); go(() => { state = 'select'; }); } }
  else if (state === 'select') {
    if (c === 'ArrowRight' || c === 'ArrowDown') { sel = (sel + 1) % SONGS.length; chirp(2400, .08); }
    else if (c === 'ArrowLeft' || c === 'ArrowUp') { sel = (sel + SONGS.length - 1) % SONGS.length; chirp(2400, .08); }
    else if (c === 'Enter' || c === 'Space') pickSong(sel);
    else if (c === 'KeyB') { RF.auto = !RF.auto; chirp(RF.auto ? 3200 : 1800, .08); }
    else if (c === 'Escape') go(() => { state = 'title'; });
  } else if (state === 'play' && G) {
    if (G.paused) {
      if (c === 'Escape' || c === 'KeyP' || c === 'Enter') resumeGame();
      else if (c === 'KeyR') restartSong();
      else if (c === 'KeyQ') quitToList();
    } else if (c === 'Escape' || c === 'KeyP') pauseGame();
    else if (c === 'Space') flockGo();
    else if (c in KEYS && !G.auto) laneDown(KEYS[c]);
  } else if (state === 'results') {
    if (c === 'Enter' || c === 'Space') restartSong();
    else if (c === 'Escape') go(() => { state = 'select'; setTheme('dusk'); });
  }
});
window.addEventListener('keyup', e => { if (e.code in KEYS) laneUp(KEYS[e.code]); });
const ptrs = new Map();
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.pointerType === 'touch') isTouch = true;
  audioInit();
  if (fade.d > 0) return;
  const x = e.clientX, y = e.clientY;
  for (let i = btns.length - 1; i >= 0; i--) { const b = btns[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; } }
  if (state === 'play' && G && !G.paused && !G.auto) {
    const l = clamp(Math.floor((x - L.left) / L.laneW), 0, 3);
    ptrs.set(e.pointerId, l); laneDown(l);
  }
});
const pup = e => { if (ptrs.has(e.pointerId)) { const l = ptrs.get(e.pointerId); ptrs.delete(e.pointerId); if (![...ptrs.values()].includes(l)) laneUp(l); } };
window.addEventListener('pointerup', pup); window.addEventListener('pointercancel', pup);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && !RF.noPause) pauseGame(); });
window.addEventListener('blur', () => { if (!RF.auto && !RF.noPause) pauseGame(); });
window.addEventListener('resize', layout);

// ============================================================ loop
RF.boids = boids; RF.start = startSong; RF.game = () => G; RF.state = () => state; RF.results = () => R;
layout();
let last = performance.now();
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(Math.max(0, (ts - last) / 1000), .05); last = ts; tNow += dt;
  update(dt); render();
}
requestAnimationFrame(frame);
})();
</script>
</body>
