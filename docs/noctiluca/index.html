<style>

  /* ---------- HUD (phone first) ---------- */

    -webkit-mask: radial-gradient(circle, transparent 56%, #000 60%); mask: radial-gradient(circle, transparent 56%, #000 60%);

  #flash.nope { animation: nope .25s; }

  #banner b { display: block; font-weight: 200; font-size: clamp(26px, 8vw, 54px); letter-spacing: .34em; margin-right: -.34em;

  #mute {

<script>
(() => {
'use strict';

/* ============================== CONFIG ============================== */
const CFG = {
  DIVE_TIME: 12,          // seconds per dive: the core loop
  TRANSITION: 1.35,       // descend animation
  STEP: 1 / 120,
  SPRING: 150, DAMP: 21, MAX_V: 1000,   // swimmer steering
  TOUCH_R: 21,            // swimmer ignites motes within this (×U)
  LINK_R: 30,             // light jumps mote-to-mote within this (×U)
  CASCADE: [0.04, 0.085], // seconds between links
  MOTE_LIFE: 2.4,
  COMBO_WINDOW: 1.25, COMBO_MAX: 9, STREAK_PER: 3,   // colonies per multiplier step
  FLASH_R: 210, FLASH_COST: 45,
  QUOTA_BASE: 120, QUOTA_STEP: 30, QUOTA_MAX: 420,
  CLUSTER_AREA: 62000,    // px² (÷U²) per colony
  RESPAWN: 0.5,
  HUES: [188, 165, 212, 262, 305, 140, 228, 285],
  SCALE: [0, 2, 4, 7, 9], // major pentatonic
  KEYS: [0, -2, 3, -4, 5, 1, -5, 2],
  METERS: [0, 200, 500, 1000, 1500, 2200, 3000, 4000, 5000, 6000, 7000],
};
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const $ = id => document.getElementById(id);

/* ============================== CANVAS ============================== */
const canvas = $('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, U = 1, DPR = 1;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  U = clamp(Math.sqrt(W * H) / 1050, 0.62, 1.15);
}
window.addEventListener('resize', resize);
resize();

const glowCache = new Map();
function glowSprite(h) {
  const key = ((Math.round(h / 8) * 8) % 360 + 360) % 360;
  let s = glowCache.get(key);
  if (s) return s;
  s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `hsla(${key},100%,94%,1)`);
  gr.addColorStop(0.1, `hsla(${key},100%,74%,.9)`);
  gr.addColorStop(0.38, `hsla(${key},100%,56%,.24)`);
  gr.addColorStop(1, `hsla(${key},100%,50%,0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  glowCache.set(key, s);
  return s;
}
function drawGlow(x, y, r, h, a) {
  if (a <= 0.004 || r <= 0) return;
  ctx.globalAlpha = a > 1 ? 1 : a;
  ctx.drawImage(glowSprite(h), x - r, y - r, r * 2, r * 2);
}

/* ============================== AUDIO ============================== */
const Sound = {
  ctx: null, on: true, last: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = this.on ? 0.9 : 0;
    const comp = c.createDynamicsCompressor();
    this.master.connect(comp); comp.connect(c.destination);
    this.bus = c.createGain(); this.bus.connect(this.master);
    const d = c.createDelay(1), fb = c.createGain(), wet = c.createGain(), lp = c.createBiquadFilter();
    d.delayTime.value = 0.24; fb.gain.value = 0.4; wet.gain.value = 0.38; lp.type = 'lowpass'; lp.frequency.value = 2600;
    this.bus.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(this.master);
    // deep-water drone
    const dg = c.createGain(); dg.gain.value = 0.05; dg.connect(this.master);
    const dl = c.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 240; dl.connect(dg);
    [73.42, 110.3, 146.6].forEach((f, i) => {
      const o = c.createOscillator(); o.type = i ? 'sine' : 'triangle'; o.frequency.value = f;
      const g = c.createGain(); g.gain.value = i === 2 ? 0.3 : 0.6; o.connect(g); g.connect(dl); o.start();
      const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = 0.07 + i * 0.05; lg.gain.value = 0.25;
      l.connect(lg); lg.connect(g.gain); l.start();
    });
  },
  setOn(v) { this.on = v; if (this.ctx) this.master.gain.setTargetAtTime(v ? 0.9 : 0, this.ctx.currentTime, 0.05); },
  tone(f, vol, dur, type, slide, delay) {
    const c = this.ctx; if (!c || !this.on) return;
    const t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, f0, f1, q) {
    const c = this.ctx; if (!c || !this.on) return;
    if (!this.nbuf) {
      this.nbuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
      const d = this.nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = c.currentTime, n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    n.buffer = this.nbuf; n.loop = true; f.type = 'bandpass'; f.Q.value = q || 1.2;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.15);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f); f.connect(g); g.connect(this.bus); n.start(t); n.stop(t + dur + 0.02);
  },
  freq(n) {
    const sc = CFG.SCALE, k = CFG.KEYS[(Math.max(G.depth, 1) - 1) % CFG.KEYS.length];
    return 293.66 * Math.pow(2, (sc[n % 5] + 12 * Math.floor(n / 5) + k) / 12);
  },
  pluck(gen) {
    const c = this.ctx; if (!c || c.currentTime - this.last < 0.032) return;
    this.last = c.currentTime;
    const n = gen < 13 ? gen : 8 + ((gen - 8) % 6);
    this.tone(this.freq(n), 0.07, 0.42, 'sine');
    if (Math.random() < 0.3) this.tone(this.freq(n) * 2, 0.025, 0.3, 'triangle');
  },
  flash() { this.noise(0.5, 0.35, 300, 5000, 0.7); [0, 2, 4, 7].forEach((n, i) => this.tone(this.freq(n + 5), 0.09, 0.9, 'triangle', 0, i * 0.03)); },
  fizzle() { this.tone(180, 0.05, 0.12, 'triangle', 120); },
  met() { this.tone(this.freq(7), 0.1, 0.5, 'triangle'); this.tone(this.freq(9), 0.1, 0.7, 'triangle', 0, 0.09); },
  descend() { this.noise(1.3, 0.3, 2400, 160, 0.9); this.tone(220, 0.1, 1.2, 'sine', 55); },
  tick() { this.tone(1320, 0.05, 0.07, 'sine'); },
  warn() { this.tone(96, 0.09, 0.5, 'sawtooth', 190); },
  snap() { this.tone(140, 0.07, 0.1, 'square', 60); },
  die() { this.tone(240, 0.3, 0.9, 'sawtooth', 36); this.noise(0.6, 0.3, 900, 80, 0.8); },
  fade() { this.tone(this.freq(4), 0.12, 1.4, 'sine', this.freq(0) / 2); },
};

/* ============================== STATE ============================== */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
const G = {
  state: 'title', depth: 0, score: 0, lit: 0, quota: CFG.QUOTA_BASE, quotaMet: false,
  time: CFG.DIVE_TIME, t: 0, clock: 0, real: 0,
  combo: 0, streak: 0, comboT: 0, charge: 1,
  hue: 188, hueTo: 188, shaft: 1,
  shake: 0, freeze: 0, timeScale: 1, flashA: 0, dark: 0,
  scrollV: 0, swapped: false, respawnT: 0, dartT: 0, pearlAt: -1, dieT: 0, overAt: 0,
  best: store.get('noctiluca.best', 0), bestDepth: store.get('noctiluca.depth', 0),
};
const P = { x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, alpha: 1, tail: [] };
let clusters = [], motes = [], anglers = [], darts = [], rings = [], pearls = [], pops = [];
const parts = [], snow = [];

const meters = d => d < CFG.METERS.length ? CFG.METERS[d] : 7000 + (d - 10) * 1000;
const zone = m => m < 1000 ? 'twilight zone' : m < 4000 ? 'midnight zone' : m < 6000 ? 'the abyss' : 'hadal zone';
const quotaFor = d => Math.min(CFG.QUOTA_BASE + CFG.QUOTA_STEP * (d - 1), CFG.QUOTA_MAX);
const anglerCount = d => Math.min(1 + Math.floor(d / 2), 6);
const targetClusters = () => clamp(Math.round(W * H / (CFG.CLUSTER_AREA * U * U)), 8, 26);

/* ============================== PARTICLES ============================== */
function spark(x, y, vx, vy, life, size, hue, drag) {
  if (parts.length > 700) return;
  parts.push({ x, y, vx, vy, life, max: life, size, hue, drag: drag || 2.2 });
}
function burst(x, y, n, speed, hue, size, life) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = speed * rand(0.2, 1);
    spark(x, y, Math.cos(a) * s, Math.sin(a) * s, life * rand(0.5, 1), size * rand(0.6, 1.3), hue + rand(-18, 18));
  }
}
function pop(x, y, text, size, hue) { pops.push({ x, y, text, size, hue, t: 0 }); }

/* ============================== COLONIES ============================== */
function colonyShape() {
  const L = CFG.LINK_R * U, pts = [], r = Math.random();
  if (r < 0.55) {                       // branching colony
    const n = randi(9, 20); pts.push({ x: 0, y: 0 });
    let guard = 0;
    while (pts.length < n && guard++ < 400) {
      const p = pts[randi(0, pts.length - 1)], a = rand(0, TAU), d = L * rand(0.5, 0.82);
      const x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d;
      if (pts.every(q => (q.x - x) ** 2 + (q.y - y) ** 2 > (L * 0.36) ** 2)) pts.push({ x, y });
    }
  } else if (r < 0.85) {                // curling strand
    const n = randi(11, 18); let a = rand(0, TAU), x = 0, y = 0;
    const curve = rand(0.14, 0.42) * (Math.random() < 0.5 ? -1 : 1);
    for (let i = 0; i < n; i++) {
      pts.push({ x, y }); a += curve + rand(-0.22, 0.22);
      x += Math.cos(a) * L * 0.62; y += Math.sin(a) * L * 0.62;
    }
  } else {                              // ring
    const n = randi(12, 18), R = n * L * 0.62 / TAU;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU;
      pts.push({ x: Math.cos(a) * R + rand(-2, 2) * U, y: Math.sin(a) * R + rand(-2, 2) * U });
    }
  }
  let cx = 0, cy = 0; pts.forEach(p => { cx += p.x; cy += p.y; });
  cx /= pts.length; cy /= pts.length; pts.forEach(p => { p.x -= cx; p.y -= cy; });
  return pts;

  ctx.fill();
  ctx.beginPath(); ctx.arc(9, -6, 1.9, 0, TAU);
  ctx.fillStyle = `rgba(210,240,255,${0.22 + 0.7 * L})`; ctx.fill();
  ctx.beginPath(); ctx.moveTo(5, -14);                         // the rod
  ctx.quadraticCurveTo(14, -30, 30, -20 + Math.sin(G.clock * 2.4 + a.ph) * 2.5);
  ctx.strokeStyle = `rgba(255,190,110,${0.3 + 0.4 * L})`; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.restore();
  ctx.globalCompositeOperation = 'lighter';                    // the lure
  const pulse = 1 + 0.18 * Math.sin(G.clock * 5 + a.ph), fl = a.flee > 0 ? 0.35 : 1;
  drawGlow(a.lx, a.ly, 30 * s * pulse, 36, 0.4 * a.alpha * fl);
  drawGlow(a.lx, a.ly, 11 * s, 44, a.alpha * fl);
}
function drawDart(d) {
  ctx.globalCompositeOperation = 'lighter';
  if (d.state === 'aim') {
    const k = d.t / 0.85, len = Math.hypot(W, H) + 200, step = 24 * U;
    for (let s = 40 * U, i = 0; s < len; s += step, i++) {
      const lead = k * len * 1.3 - s;
      if (lead < 0) break;
      drawGlow(d.x0 + d.dx * s, d.y0 + d.dy * s, 5 * U, 2, (0.18 + 0.5 * k) * (0.6 + 0.4 * Math.sin(G.clock * 30 + i)));
    }
    return;
  }
  for (let i = 0; i < 6; i++) drawGlow(d.x - d.dx * i * 9 * U, d.y - d.dy * i * 9 * U, (9 - i) * U, 2, 0.95 - i * 0.12);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(Math.atan2(d.dy, d.dx)); ctx.scale(U, U);
  ctx.beginPath(); ctx.moveTo(8, 0); ctx.quadraticCurveTo(-10, -6, -48, 0); ctx.quadraticCurveTo(-10, 6, 8, 0);
  ctx.fillStyle = '#12060a'; ctx.fill(); ctx.strokeStyle = 'rgba(255,90,80,.6)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}
function drawSwimmer() {
  const a = P.alpha; if (a <= 0) return;
  const h = G.hue, pulse = 1 + 0.06 * Math.sin(G.clock * 6), n = P.tail.length;
  drawGlow(P.x, P.y, 95 * U * pulse, h, 0.17 * a);
  for (let i = n - 1; i >= 0; i--) {
    const t = P.tail[i], k = 1 - i / n;
    drawGlow(t.x, t.y, (4 + 10 * k) * U, h + 20 * (1 - k), (0.12 + 0.55 * k) * a);
  }
  drawGlow(P.x, P.y, 27 * U * pulse, h, 0.95 * a);
  ctx.globalAlpha = a; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(P.x, P.y, 3.3 * U, 0, TAU); ctx.fill();
  if (G.charge >= 1 && (G.state === 'play' || G.state === 'title')) {
    const an = G.clock * 5;
    drawGlow(P.x + Math.cos(an) * 16 * U, P.y + Math.sin(an) * 16 * U, 6.5 * U, h + 50, 0.95 * a);
    drawGlow(P.x - Math.cos(an) * 16 * U, P.y - Math.sin(an) * 16 * U, 4.5 * U, h + 50, 0.6 * a);
  }
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const d = Math.max(G.depth, 0), bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, `hsl(${205 + G.hue * 0.06},70%,${Math.max(2.2, 9 - d * 1.3)}%)`);
  bg.addColorStop(0.6, `hsl(218,70%,${Math.max(1.4, 4.2 - d * 0.5)}%)`);
  bg.addColorStop(1, '#010206');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  if (G.shaft > 0.01) {                                // sunlight, gone by 1000 m
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.85);
    g.addColorStop(0, `hsla(195,85%,70%,${0.075 * G.shaft})`); g.addColorStop(1, 'hsla(195,85%,70%,0)');
    ctx.fillStyle = g;
    for (let i = 0; i < 5; i++) {
      const x = W * (0.12 + 0.22 * i) + Math.sin(G.real * 0.17 + i * 1.7) * 40, w = W * (0.06 + (i % 2) * 0.05), sl = H * 0.22;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + w, 0); ctx.lineTo(x + w * 1.5 - sl, H * 0.85); ctx.lineTo(x - w * 0.5 - sl, H * 0.85); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#bfe6ff';
  const streak = Math.abs(G.scrollV) * 0.035;
  for (const s of snow) { ctx.globalAlpha = 0.05 + 0.2 * s.z; ctx.fillRect(s.x, s.y, s.z * 1.8, s.z * 1.8 + streak * s.z); }

  ctx.save();
  if (G.shake > 0.2) ctx.translate(rand(-1, 1) * G.shake, rand(-1, 1) * G.shake);
  ctx.globalCompositeOperation = 'lighter';

  const life = CFG.MOTE_LIFE;
  for (const m of motes) {
    if (m.st === 0) {
      const f = Math.min(1, m.c.age * 2.5);
      drawGlow(m.x, m.y, 4.2 * m.sz * U, m.hue, (0.24 + 0.12 * Math.sin(G.clock * 2.2 + m.ph)) * f);
    } else if (m.st === 1) {
      const k = m.t / life, fl = m.t < 0.22 ? 1 - m.t / 0.22 : 0;
      const tw = 0.72 + 0.28 * Math.sin(G.clock * 19 + m.ph * 7);          // scintillation
      drawGlow(m.x, m.y, (13 + 17 * fl) * m.sz * U, m.hue + fl * 25, Math.pow(1 - k, 1.4) * tw + fl);
      drawGlow(m.x, m.y, 5.5 * m.sz * U, m.hue + 30, (1 - k) * tw);
    }
  }
  for (const p of parts) drawGlow(p.x, p.y, p.size * (0.5 + p.life / p.max), p.hue, p.life / p.max);
  for (const r of rings) {
    const a = clamp(1 - r.t / (r.dur + 0.35), 0, 1);
    ctx.globalAlpha = a * 0.8; ctx.strokeStyle = `hsl(${r.hue},100%,80%)`; ctx.lineWidth = (2 + 10 * a) * U;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = a * 0.25; ctx.lineWidth = (18 + 30 * a) * U; ctx.stroke();
  }
  for (const p of pearls) {
    const f = Math.min(1, p.t * 3), pu = 1 + 0.2 * Math.sin(G.clock * 6);
    drawGlow(p.x, p.y, 34 * U * pu, 320, 0.5 * f); drawGlow(p.x, p.y, 13 * U, 330, f);
    ctx.globalAlpha = 0.5 * f; ctx.strokeStyle = 'hsl(320,100%,82%)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, (15 + ((G.clock * 22) % 16)) * U, 0, TAU); ctx.stroke();
  }
  for (const a of anglers) drawAngler(a);
  for (const dd of darts) drawDart(dd);
  ctx.globalCompositeOperation = 'lighter';
  drawSwimmer();

  ctx.globalCompositeOperation = 'source-over';
  if (G.state === 'play') {                                    // the 12 seconds, worn as a halo
    const f = G.time / CFG.DIVE_TIME, hurry = G.time < 3;
    ctx.globalAlpha = 1; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.strokeStyle = hurry ? `hsla(18,100%,72%,${0.55 + 0.4 * Math.sin(G.clock * 16)})`
      : G.quotaMet ? `hsla(${G.hue},100%,82%,.75)` : 'rgba(255,255,255,.3)';
    ctx.beginPath(); ctx.arc(P.x, P.y, 23 * U, -Math.PI / 2, -Math.PI / 2 + TAU * f); ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of pops) {
    const k = p.t / 0.9, sc = 1 + 0.5 * Math.max(0, 1 - p.t / 0.15);
    ctx.globalAlpha = k < 0.6 ? 1 : 1 - (k - 0.6) / 0.4;
    ctx.font = `600 ${Math.round(p.size * sc * Math.max(U, 0.8))}px "Avenir Next","Segoe UI",system-ui,sans-serif`;
    ctx.fillStyle = `hsl(${p.hue},100%,86%)`; ctx.fillText(p.text, clamp(p.x, 70, W - 70), p.y);
  }
  ctx.restore();

  if (G.flashA > 0.004) { ctx.globalAlpha = G.flashA; ctx.fillStyle = `hsl(${G.hue},100%,88%)`; ctx.fillRect(0, 0, W, H); }
  if (G.dark > 0.004) { ctx.globalAlpha = G.dark; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  ctx.globalAlpha = 1;
}

/* ============================== HUD ============================== */
const hudCache = {};
function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
function setClass(id, cls, on) { const k = id + cls; if (hudCache[k] !== on) { hudCache[k] = on; $(id).classList.toggle(cls, on); } }
function hud() {
  if (G.state === 'title') return;
  setText('score', G.score.toLocaleString());
  setText('time', String(Math.ceil(G.time)));
  setText('qlabel', `light ${G.lit} / ${G.quota}`);
  const w = Math.round(clamp(G.lit / G.quota, 0, 1) * 100);
  if (hudCache.w !== w) { hudCache.w = w; $('qfill').style.width = w + '%'; }
  const c = Math.round(G.charge * 40) / 40;
  if (hudCache.c !== c) { hudCache.c = c; $('flash').style.setProperty('--c', c); }
  setClass('flash', 'ready', G.charge >= 1);
  setClass('quota', 'met', G.quotaMet);
  setClass('time', 'hurry', G.state === 'play' && G.time < 3);
}

/* ============================== INPUT ============================== */
const touches = new Map();
function press() {            // returns true if the press was consumed by a menu
  Sound.init();
  if (G.state === 'title') { startRun(); return true; }
  if (G.state === 'over') { if (G.real - G.overAt > 0.45) startRun(); return true; }
  return false;
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.pointerType === 'mouse') { P.tx = e.clientX; P.ty = e.clientY; if (!press()) flash(P.x, P.y); return; }
  const second = touches.size > 0;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0, menu: false });
  if (press()) { touches.get(e.pointerId).menu = true; return; }
  if (second) flash(P.x, P.y);
});
window.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { P.tx = e.clientX; P.ty = e.clientY; return; }
  const t = touches.get(e.pointerId); if (!t) return;
  const dx = e.clientX - t.x, dy = e.clientY - t.y;
  t.x = e.clientX; t.y = e.clientY; t.moved += Math.abs(dx) + Math.abs(dy);
  P.tx = clamp(P.tx + dx * 1.4, 6, W - 6); P.ty = clamp(P.ty + dy * 1.4, 6, H - 6);   // relative drag: thumb never hides the swimmer
});
function touchEnd(e) {
  const t = touches.get(e.pointerId); if (!t) return;
  touches.delete(e.pointerId);
  if (!t.menu && e.type === 'pointerup' && performance.now() - t.t < 230 && t.moved < 14) flash(P.x, P.y);
}
window.addEventListener('pointerup', touchEnd);
window.addEventListener('pointercancel', touchEnd);
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); if (!e.repeat && !press()) flash(P.x, P.y); return; }
  if (k === 'm') { toggleMute(); return; }
  keys[k] = true;
  if (k.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
function toggleMute() {
  Sound.setOn(!Sound.on); store.set('noctiluca.sound', Sound.on);
  $('mute').classList.toggle('off', !Sound.on);
}
$('mute').addEventListener('pointerdown', e => { e.stopPropagation(); Sound.init(); toggleMute(); });

/* ============================== BOOT ============================== */
Sound.on = store.get('noctiluca.sound', true);
$('mute').classList.toggle('off', !Sound.on);
if (G.best) $('tbest').textContent = `best ${G.best.toLocaleString()} · depth ${G.bestDepth}`;
P.x = P.tx = W / 2; P.y = P.ty = H * 0.68;
for (let i = 0; i < 12; i++) P.tail.push({ x: P.x, y: P.y + i * 4 });
for (let i = 0; i < 80; i++) snow.push({ x: rand(0, W), y: rand(0, H), z: rand(0.25, 1), ph: rand(0, TAU) });
spawnField(0);

let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min((now - last) / 1000, 0.1); last = now;
  G.real += rdt;
  if (G.freeze > 0) G.freeze -= rdt;
  else {
    acc += rdt * G.timeScale;
    let n = 0;
    while (acc >= CFG.STEP && n < 14) { update(CFG.STEP); acc -= CFG.STEP; n++; }
    if (n === 14) acc = 0;
  }
  realUpdate(rdt);
  render();
  hud();
}
requestAnimationFrame(frame);

// handle for tuning from the console
window.__noctiluca = { G, P, CFG, update, render, get motes() { return motes; }, get clusters() { return clusters; },
  get anglers() { return anglers; }, get darts() { return darts; }, startRun, flash };
})();
</script>
</body>
</html>
