/* ================= basics ================= */

const CARD=/[?&]card\b/.test(location.search); // ?card renders the clean, wide title frame og.jpg is captured from
const TAU=Math.PI*2;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(a,b,r,dt)=>lerp(a,b,1-Math.exp(-r*dt));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const E={
  out:t=>1-Math.pow(1-t,3), in:t=>t*t*t,
  back:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
  bounce:t=>{if(t<1/2.75)return 7.5625*t*t;if(t<2/2.75)return 7.5625*(t-=1.5/2.75)*t+.75;if(t<2.5/2.75)return 7.5625*(t-=2.25/2.75)*t+.9375;return 7.5625*(t-=2.625/2.75)*t+.984375}
};
const C={ink:'#2a1f2d',cream:'#f6e7c8',paper:'#fffaf0',red:'#e4472b',mustard:'#f2b632',teal:'#1f8a8a',tealD:'#19767a',wall:'#f4dcae',wall2:'#efd09a',skin:'#f3c9a5',tile:'#3a2b40',dim:'#9a8a6c'};

/* ================= audio ================= */
const AU={c:null,muted:false,lpT:18000};
try{AU.muted=localStorage.getItem('tb_mute')==='1'}catch(e){}
function audioInit(){
  if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return;}
  try{
    const A=window.AudioContext||window.webkitAudioContext,c=AU.c=new A();
    AU.lp=c.createBiquadFilter();AU.lp.type='lowpass';AU.lp.frequency.value=18000;
    AU.master=c.createGain();AU.master.gain.value=AU.muted?0:.7;
    AU.sfx=c.createGain();AU.sfx.gain.value=.9;AU.mus=c.createGain();AU.mus.gain.value=.5;
    AU.sfx.connect(AU.master);AU.mus.connect(AU.master);AU.master.connect(AU.lp);AU.lp.connect(c.destination);
    const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=b;
  }catch(e){AU.c=null}
}
function toggleMute(){AU.muted=!AU.muted;if(AU.muted)voxStop();if(AU.master)AU.master.gain.value=AU.muted?0:.7;try{localStorage.setItem('tb_mute',AU.muted?'1':'0')}catch(e){}}
function tone(o){
  const c=AU.c;if(!c)return;
  const t0=(o.at||c.currentTime)+(o.d||0),t=o.t||.15,os=c.createOscillator(),g=c.createGain();
  os.type=o.w||'sine';os.frequency.setValueAtTime(o.f,t0);
  if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t0+t);
  g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(o.v||.2,t0+(o.a||.008));g.gain.exponentialRampToValueAtTime(.0001,t0+t);
  let n=os;
  if(o.lp){const f=c.createBiquadFilter();f.type=o.ft||'lowpass';f.frequency.value=o.lp;f.Q.value=o.q||.8;os.connect(f);n=f;}
  n.connect(g);g.connect(o.bus||AU.sfx);
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=o.vd||12;l.connect(lg);lg.connect(os.frequency);l.start(t0);l.stop(t0+t+.05);}
  os.start(t0);os.stop(t0+t+.05);
}
function noise(o){
  const c=AU.c;if(!c)return;
  const t0=(o.at||c.currentTime)+(o.d||0),t=o.t||.2,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.nb;s.loop=true;f.type=o.ft||'lowpass';f.frequency.value=o.f||1000;f.Q.value=o.q||.7;
  g.gain.setValueAtTime(o.v||.2,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+t);
  s.connect(f);f.connect(g);g.connect(o.bus||AU.sfx);s.start(t0,Math.random()*.5);s.stop(t0+t+.02);
}
const PENTA=[0,2,4,7,9];
const sfx={
  plop(n){const f=262*Math.pow(2,(PENTA[n%5]+12*Math.min(2,n/5|0))/12);tone({f,f2:f*1.01,t:.16,w:'triangle',v:.25});tone({f:f*2,t:.07,v:.08});noise({t:.04,v:.12,f:900});},
  honk(v=1){tone({f:440,f2:340,t:.2,w:'sawtooth',v:.14*v,lp:1300,ft:'bandpass',q:3,a:.015});tone({f:662,f2:505,t:.2,w:'square',v:.06*v,lp:1700,ft:'bandpass',q:3,a:.015});},
  splat(){noise({t:.25,v:.4,f:480});tone({f:170,f2:48,t:.2,v:.3});},
  ding(){tone({f:1568,t:1.1,v:.2});tone({f:3140,t:.5,v:.07});},
  chime(){tone({f:784,t:.5,v:.13});tone({f:622,t:.7,v:.13,d:.22});},
  rimshot(){tone({f:190,f2:130,t:.1,w:'triangle',v:.3});tone({f:150,f2:100,t:.12,w:'triangle',v:.3,d:.13});noise({d:.3,t:.4,v:.16,f:6500,ft:'highpass'});},
  wah(){[311,294,277].forEach((f,i)=>tone({f,f2:f*.97,t:.34,d:i*.36,w:'sawtooth',v:.14,lp:900,a:.03}));tone({f:262,f2:233,t:1.1,d:1.08,w:'sawtooth',v:.15,lp:800,vib:6,vd:8,a:.04});},
  wahS(){tone({f:233,f2:196,t:.5,w:'sawtooth',v:.12,lp:800,vib:6,vd:6,a:.03});},
  horn(){tone({f:310,f2:640,t:.4,w:'square',v:.07,lp:2200});tone({f:466,f2:960,t:.4,w:'sawtooth',v:.05,lp:2600});},
  crash(){for(let i=0;i<12;i++)tone({f:55*Math.pow(2,(rnd(48)|0)/12),t:1.4,w:'triangle',v:.11,d:rnd(.05)});noise({t:.6,v:.6,f:350});},
  up(){tone({f:480,f2:1900,t:.5,v:.12,vib:9,vd:16});},
  down(){tone({f:1500,f2:260,t:.75,v:.13,vib:9,vd:16});},
  tick(){noise({t:.012,v:.03,f:3500,ft:'highpass'});},
  boing(){tone({f:130,f2:250,t:.6,v:.28,vib:24,vd:45});},
  mew(){tone({f:760,f2:520,t:.28,v:.1,w:'triangle',vib:14,vd:20,a:.04});},
  buzz(){tone({f:110,t:.3,w:'sawtooth',v:.14,lp:600});},
  fan(){[523,659,784,1047].forEach((f,i)=>tone({f,t:i===3?.4:.11,d:i*.1,w:'sawtooth',v:.09,lp:2400}));},
  whoosh(){noise({t:.22,v:.07,f:1400,ft:'bandpass',q:1.2});},
  ring(){for(let i=0;i<2;i++)tone({f:1200,t:.25,d:i*.4,v:.06,w:'square',vib:20,vd:120,lp:3000});},
  pop(){tone({f:300,f2:900,t:.08,v:.1});},
  thud(){tone({f:120,f2:50,t:.18,v:.35});noise({t:.1,v:.18,f:300});}
};
/* elevator bossa that refuses to acknowledge anything */
const MUS={next:0,step:0};
const mf=m=>440*Math.pow(2,(m-69)/12);
const CHORDS=[[38,[65,69,72,76]],[43,[65,69,71,76]],[36,[64,67,71,74]],[45,[61,64,67,73]]];
function music(){
  const c=AU.c;if(!c||c.state!=='running')return;
  const now=c.currentTime;if(MUS.next<now)MUS.next=now+.06;
  const disco=V.disco>.5,sd=disco?.25:.27,b=AU.mus;
  while(MUS.next<now+.25){
    const st=MUS.step++,s=st%8,ch=CHORDS[(st>>3)%4],root=ch[0],at=MUS.next;
    if(disco){
      if(s%2===0)tone({at,f:130,f2:45,t:.16,v:.5,bus:b});else noise({at,t:.09,v:.1,f:7000,ft:'highpass',bus:b});
      tone({at,f:mf(root+(s%2?12:0)),t:.2,w:'sawtooth',v:.16,lp:500,bus:b});
      if(s===2||s===3||s===6)ch[1].forEach(m=>tone({at,f:mf(m),t:.14,w:'square',v:.03,lp:2500,bus:b}));
    }else{
      if(s===0||s===4)tone({at,f:mf(root),t:.4,w:'triangle',v:.3,bus:b});
      if(s===3||s===7)tone({at,f:mf(root+7),t:.25,w:'triangle',v:.22,bus:b});
      if(s===0||s===3||s===6)ch[1].forEach(m=>tone({at,f:mf(m),t:.22,w:'triangle',v:.045,bus:b}));
      noise({at,t:.03,v:s%2?.05:.025,f:8000,ft:'highpass',bus:b});
      if(s===2||s===5)noise({at,t:.02,v:.08,f:2500,ft:'bandpass',q:4,bus:b});
      if(s%2===0&&Math.random()<.35)tone({at,f:mf(pick(ch[1])+12),t:.6,v:.06,bus:b});
    }
    MUS.next+=sd;
  }
  const duck=voxBusy(VOX.cur)?.2:.5;
  if(duck!==AU.duck){AU.duck=duck;AU.mus.gain.setTargetAtTime(duck,now,.12);}
  const lpT=V.water>.5?520:18000;
  if(lpT!==AU.lpT){AU.lpT=lpT;AU.lp.frequency.setTargetAtTime(lpT,now,.15);}
}

/* ================= emoji stickers ================= */
const SP=new Map();
function sprite(e,size){
  const k=e+'|'+size;let s=SP.get(k);if(s)return s;
  const q=2,pad=Math.ceil(size*.16)+5,dim=size+pad*2,px=Math.ceil(dim*q);
  const mk=()=>{const c=document.createElement('canvas');c.width=c.height=px;return c};
  const raw=mk(),rg=raw.getContext('2d');
  rg.font=`${size*q}px ${FE}`;rg.textAlign='center';rg.textBaseline='middle';rg.fillText(e,px/2,px/2+size*q*.07);
  const sil=col=>{const c=mk(),g=c.getContext('2d');g.drawImage(raw,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,px,px);return c};
  const w=sil(C.paper),d=sil(C.ink),out=mk(),g=out.getContext('2d'),r=Math.max(2.4,size*.065)*q;
  g.globalAlpha=.16;for(let i=0;i<8;i++){const a=i/8*TAU;g.drawImage(d,Math.cos(a)*r,Math.sin(a)*r+r*.9+2*q);}
  g.globalAlpha=1;for(let i=0;i<18;i++){const a=i/18*TAU;g.drawImage(w,Math.cos(a)*r,Math.sin(a)*r);}
  g.drawImage(raw,0,0);
  s={c:out,dim};SP.set(k,s);return s;
}
function drawE(e,x,y,size=40,rot=0,sx=1,sy=1){
  const base=size<=64?40:Math.round(size/10)*10,s=sprite(e,base),k=size/base;
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.scale(sx*k,sy*k);
  ctx.drawImage(s.c,-s.dim/2,-s.dim/2,s.dim,s.dim);ctx.restore();
}

/* ================= drawing helpers ================= */
function rr(x,y,w,h,r,g=ctx){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}
function txt(s,x,y,o={},g=ctx){
  g.font=`${o.size||20}px ${o.font||FD}`;g.textAlign=o.align||'center';g.textBaseline=o.base||'middle';
  if(o.sw){g.lineJoin='round';g.lineWidth=o.sw;g.strokeStyle=o.stroke||C.ink;g.strokeText(s,x,y);}
  g.fillStyle=o.color||C.cream;g.fillText(s,x,y);
}
function wrap(text,font,maxW){
  ctx.font=font;const words=text.split(' '),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}

  if(o.now&&N.cur&&!N.cur.out){const c=N.cur;if(c.drop&&(voxBusy(c.vo)||!c.done))c.drop();c.done=true;c.cut=true;voxStop();}
  while(N.q.length>4){let i=0,lo=99;N.q.forEach((q,j)=>{if(q.pri<lo){lo=q.pri;i=j;}});const d=N.q.splice(i,1)[0];if(d.drop)d.drop();}

function narrator(dt){
  const c=N.cur;

    while(N.q.length&&N.q[0].pri===0&&T-N.q[0].at>10){const d=N.q.shift();if(d.drop)d.drop();} // an aside that waited this long is stale
    if(N.q.length){const m=N.q.shift();N.no++;
      N.cur={text:m.text,head:m.head,pri:m.pri,drop:m.drop,t:0,chars:0,rot:rnd(-.025,.025),done:false,doneT:0,out:0,hold:1.1+m.text.length*.03,vo:m.vo===false?null:voxPlay(m.vo||m.text)};
      sfx.whoosh();}
    return;
  }
  c.t+=dt;
  const speaking=voxBusy(c.vo)&&c.t<14;
  if(c.vo&&!speaking&&c.vEnd===undefined){c.vEnd=c.t;if(c.rim)sfx.rimshot();}
  if(c.t>.22&&!c.done){
    const p=c.chars|0;c.chars=Math.min(c.text.length,c.chars+dt*48);
    if(!c.vo&&(c.chars|0)!==p&&(c.chars|0)%3===0)sfx.tick();

  const held=c.t>c.doneT+(N.q.length?Math.max(.8,c.hold*.55):c.hold)&&(!c.vo||(!speaking&&c.t>c.vEnd+.3));

/* ================= stack ================= */
let topX=0,topY=0;
function layout(){
  const st=G.stack,n=st.length,hs=M.heavy?.86:1;let x=P.x,y=trayBase();
  for(let i=0;i<n;i++){const s=st[i],a=G.sway*(.35+.95*i/Math.max(n,5)),h=s.h*hs;
    s.a=a;s.cx=x+Math.sin(a)*h*.5+s.off;s.cy=y-Math.cos(a)*h*.5;x+=Math.sin(a)*h;y-=Math.cos(a)*h;}
  topX=x;topY=y;
}
function updSway(dt){
  const st=G.stack,n=st.length;let wt=0,bias=0;
  for(const s of st){wt+=s.wt;bias+=s.off*s.wt;}
  wt=Math.max(0,wt);
  const k=Math.max(2.2,46/(1+wt*.22)-wt*.5),c=5.2-Math.min(2.6,wt*.13);
  // the stack lags behind Gerald when he moves and swings forward when he stops
  const lag=.5+wt*.12;
  let a=-k*G.sway-c*G.swayV-clamp(P.axs,-4500,4500)*.0004*lag-P.vx*.0024*lag+bias*.012;
  if(M.wind)a+=Math.sign(M.wind)*.9*Math.min(1,wt/6);
  G.swayV+=a*dt;G.sway+=G.swayV*dt;
  if(state==='play'&&!G.over&&n>=3){if(Math.abs(G.sway)>.58)topple(false);}
  else G.sway=clamp(G.sway,-.55,.55);
}
function toDebris(s,x,y,vx,vy,bounced){G.debris.push({def:s.def,key:s.key,x,y,vx,vy,rot:s.a||s.rot||0,rv:rnd(-7,7),sc:s.sc||1,plated:s.plated,label:s.label,bounced:!!bounced,t:0});}
function topple(all){
  const st=G.stack,n=st.length;if(!n)return;
  const k0=all?0:Math.max(1,Math.floor(n*.35)),dir=Math.sign(G.sway)||pick([-1,1]);let lost=false;
  for(let i=k0;i<n;i++){const s=st[i];toDebris(s,s.cx,s.cy,dir*(90+(i-k0)*38)+rnd(-30,30),-120-rnd(180));if(s.plated)lost=true;}
  st.length=k0;G.sway=0;G.swayV=0;G.topples++;sfx.down();shake(8);
  if(!all){if(lost)complaint(TOPPLE);else heckleFrom(TOPPLE);}
}
function updBehav(dt){
  const st=G.stack;
  for(let i=0;i<st.length;i++){
    const s=st[i];s.t+=dt;s.sq=Math.max(0,s.sq-dt*5);
    if(s.key==='goose'){
      s.tm=(s.tm??rnd(2,5))-dt;
      if(s.tm<=0){s.tm=rnd(3.5,7);s.flip=!s.flip;s.sq=.8;G.swayV+=pick([-1,1])*rnd(.3,.6);sfx.honk(state==='title'?.5:.8);floatT('HONK',s.cx+rnd(-12,12),s.cy-20,'#fff',15);}
    }else if(state==='play'&&s.key==='cat'&&!s.done&&s.t>4.5&&i<st.length-1){
      s.done=true;const v=st.splice(i+1,1)[0],dir=pick([-1,1]);
      toDebris(v,v.cx,v.cy,dir*260,-220);s.flip=dir>0;s.sq=.7;sfx.mew();floatT('the cat did that',s.cx,s.cy-28,'#fff',14);
      if(!G.seen.catpush){G.seen.catpush=1;say(SAID.catPush);}
      break;
    }else if(state==='play'&&s.key==='raccoon'&&!s.done&&s.t>5&&i>0&&st[i-1].plated){
      s.done=true;const v=st.splice(i-1,1)[0];
      burst(v.cx,v.cy,10,v.def.c||'#fff',120);sfx.pop();floatT('nom',s.cx,s.cy-24,'#fff',15);addTips(.01,s.cx,s.cy-46);
      if(!G.seen.nom){G.seen.nom=1;say(SAID.nom);}

    }
  }
}

/* ================= falling things ================= */
const ramp=()=>{const t=clamp(G.t/180,0,1);return t*t*(3-2*t);};
function spawn(key,o={}){
  const def=DEFS[key];let x=o.x;
  if(x===undefined){let n=0;do{x=rnd(34,W-34);}while(Math.abs(x-G.lastSX)>Math.max(150,W*.5)&&++n<8);G.lastSX=x;}
  const f={def,key,x,y:o.y??-36,vy:o.vy??lerp(168,275,ramp())*rnd(.92,1.08),rot:rnd(-.3,.3),rv:rnd(-1.4,1.4),seed:rnd(TAU),sc:o.sc||1,plated:o.plated??!!def.food,big:!!o.big,label:o.label};
  G.fall.push(f);return f;
}
function spawner(dt){
  if(G.over)return;G.noSpawn-=dt;
  if(G.noSpawn>0||M.noSpawn||M.freeze||G.risers.length)return;
  G.spawnT-=dt;if(G.spawnT>0)return;
  const r=ramp();G.spawnT=(G.t<9?1.5:lerp(1.35,.74,r))*M.spawnMul*rnd(.85,1.15);
  let key;
  if(M.only)key=M.only;
  else if(G.t>5&&Math.random()<lerp(.26,.36,r)){
    if(!G.wSpawned)key='goose';else{key=wpick();if(key===G.lastW)key=wpick();}
    G.wSpawned++;G.lastW=key;
  }else key=pick(FOODS);
  spawn(key);
}
function updFall(dt){
  for(let i=G.fall.length-1;i>=0;i--){
    const f=G.fall[i],r=15*f.sc,pb=f.y+r;
    if(!M.freeze){
      f.y+=f.vy*M.fall*dt;f.x+=M.wind*dt;
      if(V.water>.5)f.x+=Math.sin(G.t*2+f.seed)*30*dt;
      f.rot+=f.rv*dt*(V.water>.5?.4:1);f.x=clamp(f.x,18,W-18);
    }
    const b=f.y+r;
    if(b>=topY&&pb<=topY+14&&Math.abs(f.x-topX)<(f.big?66:39)){G.fall.splice(i,1);catchIt(f);continue;}
    if(M.also&&G.ev&&Math.abs(G.ev.d.yo||0)<6){
      const ax=W-P.x,ay=floorY-90;
      if(b>=ay&&pb<=ay+14&&Math.abs(f.x-ax)<32&&f.key!=='tips'&&!f.big){
        G.fall.splice(i,1);G.ev.d.got++;sfx.pop();burst(f.x,ay,8,C.teal,110);addTips(.25,ax,ay-30);floatT(pick(['Also Gerald: got it','Also Gerald: mine','Also Gerald: oh no']),ax,ay-52,'#bfe9e6',13);continue;
      }
    }
    if(b>=floorY-2){G.fall.splice(i,1);miss(f);}
  }
}
function catchIt(f){
  const def=f.def,n=G.stack.length,ev=G.ev;
  const it=mkItem(f.key,{sc:f.big?2.6:1,off:clamp(f.x-topX,-14,14)*.6,plated:f.plated,label:f.label});
  G.stack.push(it);
  G.stack.forEach((s,i)=>s.sq=Math.max(s.sq,.5*(i+1)/(n+1)));
  G.swayV+=clamp(f.x-topX,-30,30)*.012*(1+n*.06);
  P.syV-=M.heavy?2.6:1.2;
  let val=f.big?10:(def.tip??(.25+.05*n));
  if(f.key!=='tips')addTips(val*M.tipMul,f.x,topY-14,f.big);
  sfx.plop(n);
  burst(f.x,topY,f.big?26:7,[C.mustard,'#fff'],f.big?260:120);
  shake(f.big?12:M.heavy?4:1.2);if(f.big){G.freeze=.07;sfx.thud();}
  G.tallest=Math.max(G.tallest,G.stack.length);

  if(ev&&ev.d.f===f){
    if(f.key==='tips'){addTips(5,f.x,topY-14,true);ev.endLine=SAID.tipsCaught;}
    else ev.endLine=SAID.bigCaught;
  }
}
function miss(f){
  const ev=G.ev;
  if(ev&&ev.d.f===f)ev.endLine=f.key==='tips'?SAID.tipsMissed:SAID.bigMissed;
  if(f.plated){splat(f.x,f.def.c||'#e9a23b',f.sc);if(!G.over)complaint(DROP);}
  else{toDebris(f,f.x,floorY-16,rnd(-70,70),-Math.abs(f.vy)*.9-80,true);sfx.thud();}

function splat(x,c,sc=1,quiet){

function updDebris(dt){
  for(let i=G.debris.length-1;i>=0;i--){

    if(d.walking){d.x+=d.vx*dt;if(d.x<-60||d.x>W+60)G.debris.splice(i,1);continue;}

function step(dt){

  fade=Math.max(0,fade-dt*2.6);

  if(G.heck){G.heck.t+=dt;if(G.heck.t>G.heck.life)G.heck=null;}
  G.shake=Math.max(0,G.shake-dt*(18+G.shake*6));G.tipPop=Math.max(0,G.tipPop-dt*5);G.compPop=Math.max(0,G.compPop-dt*3);G.beat=Math.max(0,G.beat-dt*3);
  for(let i=G.stains.length-1;i>=0;i--){const s=G.stains[i];s.t+=dt;if(s.t>s.life)G.stains.splice(i,1);}
  if(state==='over'){
    OT+=dt;const n=Math.min(R.rows.length,Math.floor((OT-.55)/.13));if(n>R.n){R.n=n;sfx.tick();}
    updSway(dt*.5);layout();updDebris(dt*.5);return;
  }
  if(G.freeze>0){G.freeze-=dt;return;}
  let d=dt;
  if(state==='play'){
    if(G.over){G.ts=damp(G.ts,.25,6,dt);G.overT+=dt;if(G.overT>2.9){state='over';OT=0;}}
    d=dt*G.ts;G.t+=d;
  }
  updPlayer(d);updSway(d);
  if(CARD){G.sway=.13;G.swayV=0;P.x=P.target=cardX();P.vx=0;}
  layout();if(!CARD)updBehav(d);
  if(state==='title')return;

  if(!G.over){
    G.heckT-=d;if(G.heckT<=0&&!G.heck){G.heckT=rnd(8,12);heckleAmbient();}
    let h=0;for(const s of G.stack)h+=s.h;
    if(h>=G.goalH)deliver();
    const wt=G.stack.reduce((a,s)=>a+s.wt,0);
    if((wt>8||Math.abs(G.sway)>.35)&&Math.random()<d*5)part({x:P.x+pick([-1,1])*rnd(14,20),y:floorY-88,vx:rnd(-30,30),vy:-rnd(20,60),g:320,life:.5,size:3,color:'#9fd8ff'});
  }
}

  const y=floorY-106-G.goalH;let h=0;for(const s of G.stack)h+=s.h;const p=clamp(h/G.goalH,0,1);
  ctx.save();ctx.setLineDash([8,8]);ctx.lineDashOffset=-T*14;ctx.lineWidth=2.5;ctx.strokeStyle='rgba(42,31,45,.42)';
  ctx.beginPath();ctx.moveTo(8,y);ctx.lineTo(W-48,y);ctx.stroke();ctx.restore();
  rr(W-112,y-20,66,17,5);ctx.fillStyle=C.ink;ctx.fill();
  txt('ORDER UP',W-79,y-11,{size:10.5,color:C.mustard});
  drawE('🛎️',W-26,y-6,34,p>.7?Math.sin(T*20)*.14:0);
}
function drawEntities(){
  drawBell();
  for(const s of G.stains){const a=Math.min(1,(s.life-s.t)/1.5)*.75;ctx.globalAlpha=a;ctx.fillStyle=s.c;ctx.beginPath();ctx.ellipse(s.x,floorY+5,s.r,s.r*.24,0,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(s.x+s.r*.8,floorY+9,s.r*.3,s.r*.1,0,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  const ev=state==='play'?G.ev:null;
  for(const d of G.debris)if(d.walking){const b=Math.abs(Math.sin(d.t*10))*4;drawThing(d.key,d.def,d.x,d.y-b,Math.sin(d.t*10)*.08,d.sc,1,1,d.vx>0,false,d.label);}
  if(ev&&ev.def.ent)ev.def.ent(ev);
  // Gerald
  let wt=0;for(const s of G.stack)wt+=s.wt;
  const mood=clamp(Math.abs(G.sway)/.45+(wt>9?.35:0)+(G.over?1:0),0,1);
  drawWaiter(P.x,floorY,{sx:1+(1-P.sy)*.7,sy:P.sy,step:P.step,lean:P.lean,lx:P.lx,ly:P.ly,mood,skate:M.slip,hop:P.hop*8,
    acc:V.water>.5?'🤿':V.disco>.5?'🕶️':null,hat:M.party});
  // stack
  const hs=M.heavy?.86:1;
  for(const s of G.stack){const bob=s.key==='balloon'?Math.sin(T*3+s.t)*2:0;drawThing(s.key,s.def,s.cx,s.cy+bob,s.a+Math.sin(T*2.3+s.t)*.02,s.sc,1+s.sq*.28,(1-s.sq*.28)*hs,s.flip,s.plated,s.label);}
  for(const r of G.risers)drawThing(r.key,r.def,r.x,r.y,r.rot,r.sc,1,1,false,r.plated,r.label);
  for(const d of G.debris)if(!d.walking)drawThing(d.key,d.def,d.x,d.y,d.rot,d.sc,1,1,false,d.plated,d.label);
  for(const f of G.fall){const wig=M.freeze?Math.sin(T*34+f.seed)*.035:0,st=1+Math.min(.12,f.vy*M.fall/3000);
    drawThing(f.key,f.def,f.x+(M.freeze?Math.sin(T*40+f.seed)*.8:0),f.y,f.rot+wig,f.sc,1/st,st,false,f.plated,f.label);}
  if(ev&&ev.def.fgEnt)ev.def.fgEnt(ev);
  drawParts();drawFloats();
}
function drawFg(){
  const x0=-offX,ww=VW/S;
  if(V.night>.01){ctx.fillStyle=`rgba(22,26,78,${.34*V.night})`;ctx.fillRect(x0,0,ww,H);}
  if(V.water>.01){
    ctx.fillStyle=`rgba(24,116,170,${.4*V.water})`;ctx.fillRect(x0,0,ww,H);
    ctx.strokeStyle=`rgba(255,255,255,${.2*V.water})`;ctx.lineWidth=3;
    for(let j=0;j<3;j++){ctx.beginPath();for(let x=x0;x<=x0+ww;x+=20){const y=70+j*26+Math.sin(x*.03+T*1.6+j*2)*7;x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();}
  }
  if(V.disco>.01){
    ctx.fillStyle=`rgba(40,10,60,${.34*V.disco})`;ctx.fillRect(x0,0,ww,H);
    ctx.save();ctx.globalCompositeOperation='screen';
    for(let i=0;i<6;i++){const a=Math.PI/2+Math.sin(T*.9+i*1.05)*1.1,len=H*1.2;
      ctx.fillStyle=`hsla(${(i*60+T*40)%360},95%,60%,${.2*V.disco})`;
      ctx.beginPath();ctx.moveTo(W/2,DISCO_Y);ctx.lineTo(W/2+Math.cos(a-.09)*len,DISCO_Y+Math.sin(a-.09)*len);ctx.lineTo(W/2+Math.cos(a+.09)*len,DISCO_Y+Math.sin(a+.09)*len);ctx.closePath();ctx.fill();}
    ctx.restore();
  }
  if(V.dark>.01){
    const cx=P.x,cy=floorY-150,g=ctx.createRadialGradient(cx,cy,70,cx,cy,210);
    g.addColorStop(0,'rgba(12,8,22,0)');g.addColorStop(1,`rgba(12,8,22,${.93*V.dark})`);
    ctx.fillStyle=g;ctx.fillRect(x0,0,ww,H);
    ctx.globalAlpha=V.dark;ctx.fillStyle='#fff';
    for(let i=0;i<5;i++){const ex=((i*.37+.11)%1)*W,ey=110+((i*.61)%1)*(floorY-260);
      if(Math.hypot(ex-cx,ey-cy)<200||Math.sin(T*1.3+i*2.1)>.82)continue;
      for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(ex+s*8,ey,4.5,6,0,0,TAU);ctx.fill();}
      ctx.fillStyle=C.ink;for(const s of[-1,1]){ctx.beginPath();ctx.arc(ex+s*8+clamp((cx-ex)/60,-2,2),ey+1,2,0,TAU);ctx.fill();}ctx.fillStyle='#fff';}
    ctx.globalAlpha=1;
  }
}

/* ================= HUD & screens ================= */
function drawHUD(){
  const x0=-offX,ww=VW/S;
  ctx.fillStyle=C.ink;ctx.fillRect(x0,0,ww,44);
  ctx.fillStyle=C.mustard;ctx.fillRect(x0,44,ww,6);ctx.fillStyle='#c98f1d';for(let x=x0+14;x<x0+ww;x+=46)ctx.fillRect(x,45,10,4);
  ctx.fillStyle=C.ink;ctx.fillRect(x0,50,ww,2);
  if(!CARD){ctx.globalAlpha=.9;txt(AU.muted?'🔇':'🔊',W-20,23,{size:17,font:FE});ctx.globalAlpha=1;}
  if(state==='title'){
    txt(BEST>0&&!CARD?'BEST SHIFT '+money(BEST):'EST. RECENTLY',12,23,{size:13,color:C.mustard,align:'left'});
    return;
  }
  txt('TIPS',12,12,{size:10.5,color:C.mustard,align:'left'});
  ctx.save();ctx.translate(12,30);const k=1+G.tipPop*.22;ctx.scale(k,k);
  if(G.tipsLoose)txt('(on the loose)',0,0,{size:13,font:FT,color:C.cream,align:'left'});
  else txt(money(G.shown),0,0,{size:22,color:M.tipMul>1?C.mustard:C.cream,align:'left'});
  ctx.restore();
  txt('COMPLAINTS',W-42,12,{size:10.5,color:C.mustard,align:'right'});
  for(let i=0;i<3;i++){
    const on=i<G.complaints,x=W-50-(2-i)*21,pop=on&&i===G.complaints-1?G.compPop:0;
    ctx.save();ctx.translate(x,30);ctx.rotate((i-1)*.08);ctx.scale(1+pop*.6,1+pop*.6);
    rr(-7.5,-9,15,18,2.5);ctx.fillStyle=on?C.red:'#4a3b50';ctx.fill();
    if(on)txt('!',0,.5,{size:14,color:'#fff'});
    ctx.restore();
  }
  const ev=G.ev;
  if(ev&&state==='play'){const p=clamp(1-ev.t/ev.dur,0,1);ctx.fillStyle=C.red;ctx.fillRect(W/2-60,38,120*p,3);ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(W/2-60+120*p,38,120*(1-p),3);}
}
function drawTitle(){
  const cx=W/2,tx=CARD?W*.3:cx,ty=CARD?318:158,ts=CARD?2.1:1;
  ctx.save();ctx.translate(tx,ty);ctx.scale(ts,ts);ctx.rotate(-.06);
  [['TRAY',-8,-44],['BIEN',10,46]].forEach(([word,ox,oy],wi)=>{
    ctx.font=`100px ${FD}`;const tw=ctx.measureText(word).width;let x=ox-tw/2;
    for(let i=0;i<word.length;i++){const ch=word[i],w=ctx.measureText(ch).width,y=oy+Math.sin(T*2.4+i*.7+wi*1.6)*5;
      ctx.save();ctx.translate(x+w/2,y);ctx.rotate(Math.sin(T*1.9+i+wi)*.035);
      txt(ch,5,6,{size:100,color:C.ink,sw:12});txt(ch,0,0,{size:100,color:wi?C.mustard:C.red,sw:12});ctx.restore();x+=w;}
  });
  ctx.restore();
  ctx.save();ctx.translate(tx,CARD?596:282);ctx.scale(CARD?1.7:1,CARD?1.7:1);ctx.rotate(.02);
  const s='the city’s fourth-tallest restaurant';ctx.font=`14px ${FT}`;const w=ctx.measureText(s).width+28;
  rr(-w/2,-15,w,30,4);ctx.fillStyle=C.paper;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=C.ink;ctx.stroke();
  txt(s,0,1,{size:14,font:FT,color:C.ink});ctx.restore();
  if(CARD)return;
  const p=.5+.5*Math.sin(T*4.2),py=floorY+38;
  ctx.save();ctx.translate(cx,py);ctx.scale(1+p*.03,1+p*.03);
  rr(-112,-21,224,42,21);ctx.fillStyle=C.red;ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=C.ink;ctx.stroke();
  txt('TAP TO CLOCK IN',0,1.5,{size:23,color:'#fff'});ctx.restore();
  ctx.font=`11.5px ${FT}`;const hint='drag or ← → to move · catch what’s on a plate',hw=ctx.measureText(hint).width+18;
  rr(cx-hw/2,py+31,hw,22,6);ctx.fillStyle='rgba(255,250,240,.92)';ctx.fill();
  txt(hint,cx,py+42.5,{size:11.5,font:FT,color:C.ink});
}
function drawReceipt(){
  const t=OT,x0=-offX,ww=VW/S;
  ctx.fillStyle=`rgba(42,31,45,${.66*Math.min(1,t/.4)})`;ctx.fillRect(x0,0,ww,H);
  const pw=Math.min(W-36,340),pad=18,font=`13px ${FT}`;
  if(R.w!==pw){R.w=pw;let h=pad;for(const r of R.rows){if(r.k==='w'){r.lines=wrap(r.s,font,pw-pad*2-8);r.h=r.lines.length*17+6;}else if(r.k==='hr')r.h=16;else if(r.k==='lv')r.h=21;else if(r.k==='btn')r.h=74;h+=r.h;}R.h=h+pad-6;}
  const y0=lerp(H+30,Math.max(58,(H-R.h)/2+10),E.back(Math.min(1,t/.55)));
  ctx.save();ctx.translate(W/2,y0);ctx.rotate(-.012);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-pw/2+5,6,pw,R.h);
  ctx.beginPath();ctx.moveTo(-pw/2,0);
  const n=Math.round(pw/12),zw=pw/n;for(let i=1;i<=n;i++){ctx.lineTo(-pw/2+i*zw-zw/2,-5);ctx.lineTo(-pw/2+i*zw,0);}
  ctx.lineTo(pw/2,R.h);for(let i=1;i<=n;i++){ctx.lineTo(pw/2-i*zw+zw/2,R.h+5);ctx.lineTo(pw/2-i*zw,R.h);}
  ctx.closePath();ctx.fillStyle=C.paper;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.ink;ctx.lineJoin='round';ctx.stroke();
  let y=pad;
  for(let i=0;i<R.rows.length;i++){
    const r=R.rows[i];if(i>=R.n)break;const cy=y+r.h/2;
    if(r.k==='c')txt(r.s,0,cy,{size:r.z||13,font:r.f||FT,color:r.col||C.ink});
    else if(r.k==='hr'){ctx.strokeStyle='rgba(42,31,45,.35)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(-pw/2+pad,cy);ctx.lineTo(pw/2-pad,cy);ctx.stroke();ctx.setLineDash([]);}
    else if(r.k==='lv'){
      txt(r.l,-pw/2+pad,cy,{size:13.5,font:FT,color:C.ink,align:'left'});const lw=ctx.measureText(r.l).width;
      txt(r.v,pw/2-pad,cy,{size:13.5,font:FT,color:C.ink,align:'right'});const vw=ctx.measureText(r.v).width;
      ctx.fillStyle='rgba(42,31,45,.35)';for(let x=-pw/2+pad+lw+8;x<pw/2-pad-vw-6;x+=6)ctx.fillRect(x,cy+4,1.6,1.6);
    }
    else if(r.k==='w'){ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=C.ink;r.lines.forEach((l,j)=>ctx.fillText(l,0,y+11+j*17));}
    else if(r.k==='btn'){
      const p=.5+.5*Math.sin(T*4.2),ok=OT>1.5;
      ctx.save();ctx.translate(0,y+30);ctx.scale(1+p*.03,1+p*.03);ctx.globalAlpha=ok?1:.4;
      rr(-106,-20,212,40,20);ctx.fillStyle=C.red;ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=C.ink;ctx.stroke();
      txt('CLOCK BACK IN',0,1.5,{size:22,color:'#fff'});ctx.restore();
      txt(R.isBest?'★ new best shift ★':'best shift: '+money(BEST),0,y+62,{size:11.5,font:FT,color:R.isBest?C.red:C.dim});
    }
    y+=r.h;
  }
  ctx.restore();
}

/* ================= frame ================= */
function draw(){
  const k=DPR*S,x0=-offX,ww=VW/S;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.ink;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(k,0,0,k,offX*k,0);
  const sh=G.shake;
  ctx.save();
  if(sh>.05)ctx.translate(rnd(-sh,sh),rnd(-sh,sh));
  if(V.flip>.001){ctx.translate(W/2,0);ctx.scale(Math.cos(V.flip*Math.PI),1);ctx.translate(-W/2,0);}
  ctx.drawImage(bgC,x0,0,ww,H);
  drawBgDyn();
  ctx.save();
  const ek=CARD?CARD_K:V.tiny;
  if(CARD||ek<.999){ctx.translate(W/2,floorY);ctx.scale(ek,ek);ctx.translate(-W/2,-floorY);}
  drawEntities();
  ctx.restore();
  drawFg();
  ctx.restore();
  if(offX>0){ctx.fillStyle='rgba(42,31,45,.62)';ctx.fillRect(x0,0,offX,H);ctx.fillRect(W,0,offX,H);ctx.fillStyle=C.ink;ctx.fillRect(-3,0,3,H);ctx.fillRect(W,0,3,H);}
  ctx.drawImage(vigC,x0,0,ww,H);
  drawTicket();drawHUD();drawHeckle();
  if(state==='title')drawTitle();
  if(state==='over')drawReceipt();
  if(fade>0){ctx.globalAlpha=fade;ctx.fillStyle=C.ink;ctx.fillRect(x0,0,ww,H);ctx.globalAlpha=1;}
}
const STEP=1/120;let acc=0,last=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.1);last=now;acc+=dt;
  while(acc>=STEP){step(STEP);acc-=STEP;}
  music();draw();
  const hideBy=state!=='title'||CARD;if(byEl&&byEl.hidden!==hideBy)byEl.hidden=hideBy;
}

/* ================= input ================= */
const ptr={down:false,lx:0};
const toWX=e=>e.clientX/S-offX;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();
  const wx=toWX(e),wy=e.clientY/S;
  if(wx>W-42&&wy<46){toggleMute();return;}
  ptr.down=true;ptr.lx=e.clientX;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(e.pointerType==='mouse')P.target=clamp(wx,30,W-30);
  if(state!=='play')action();
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){P.target=clamp(toWX(e),30,W-30);return;}
  if(!ptr.down)return;
  P.target=clamp(P.target+(e.clientX-ptr.lx)/S*1.35,30,W-30);ptr.lx=e.clientX;
});
const up=()=>{ptr.down=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(e.repeat)return;
  keys[e.code]=true;audioInit();
  if(e.code==='KeyM')toggleMute();
  if(e.code==='Space'||e.code==='Enter')action();
});
window.addEventListener('keyup',e=>{keys[e.code]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{last=performance.now();acc=0;});

/* ================= boot ================= */
resize();P.x=P.target=W/2;booted=true;titleSetup();mods();layout();
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('20px TBD'),document.fonts.load('14px TBT')]).then(buildBg,()=>{});}
window.__tb={get G(){return G},P,V,get state(){return state},start:startRun,VOX,voiceLines,vhash,ev:id=>{if(G.ev)endEvent(true);startEvent(EV.find(e=>e.id===id));},EV,step,draw};
last=performance.now();requestAnimationFrame(frame);
})();
</script>
